# Toolchains for the native SHARC core (native/). Python stays on uv.
# Groups: setup, emu*, web*, scenario*, test*, lint*, perf*, gen:*, dev:*, check.
# Old task names stay as aliases.

[settings]
activate_aggressive = true

[tools]
rust = "1.98.1"
pnpm = "12.8.2"

# --- setup ---

[tasks.setup]
run = [
  "uv sync",
  "pnpm install --frozen-lockfile",
  "uv run python -m emu.unicorn_compat || tools/install-patched-unicorn.sh",
]
description = "Install the Python and web dependencies; build the patched Unicorn when the installed one lacks the patches"

# --- desktop emulator ---

[tasks.emu]
run = "uv run python tools/native_emu.py"
description = "Build once and run the desktop emulator (DN2 audio when local inputs are ready)"

[tasks."emu:build"]
run = "uv run python tools/native_emu.py --build-only"
description = "Build the desktop emulator exactly as `mise run emu` does, without launching it"

[tasks."emu:serve"]
run = "uv run python tools/native_emu.py --daemon"
description = "Run the emulator without a window, paused, serving the control socket (out/native/run/current.json); drive it with tools/digi_client.py. --free runs it live."

[tasks."emu:ctl"]
run = "uv run python tools/digi_client.py"
description = "Control a running emulator: mise run emu:ctl status | inject PATCHED.syx | step N | tap CODE | frame out.png | call METHOD k=v | events"

[tasks."emu:ready"]
alias = "ready"
run = "uv run python tools/ready.py"
description = "Build a device's ready snapshot from the .syx alone: mise run emu:ready -- dn2|dt2 [--card-image IMG] (cold DSP start; about 2 min)"

# --- web panel ---

[tasks.web]
run = "pnpm dev"
description = "Build the browser core (WASM) and serve the web panel (astro dev)"

[tasks."web:build"]
run = "pnpm build"
description = "Build the browser core (WASM) and the static web panel (astro build, with the firmware guard)"

[tasks."web:check"]
run = "pnpm check"
description = "Type-check the web panel (astro check)"

[tasks."web:lint"]
run = "pnpm lint"
description = "Lint the web panel (oxlint with eslint-plugin-solid)"

[tasks."web:test"]
run = "pnpm test"
description = "Run the web panel's audio-health tests (node --test)"

[tasks."web:wasm"]
alias = "wasm"
run = "tools/native_wasm.py"
description = "Build only the browser emulator core (WASM)"

[tasks."web:bench"]
run = "uv run python tools/benchlock.py run --exclusive -- node tools/browser_bench.mjs"
description = "Headless Chrome throughput bench of the coupled browser core (needs local inputs): mise run web:bench -- --seconds 10 --runs 3 [--js-flags=--no-liftoff] [--profile]"

[tasks."web:parity"]
alias = "wasm:parity"
run = "node tools/wasm_parity.mjs --scenario"
description = "Check the browser core renders a scenario's PCM byte-identical to native: mise run web:parity trig1-tap-release"

# --- scenarios (scenarios/README.md) ---

[tasks."scenario:build"]
run = "uv run python tools/coupled.py build"
description = "Build the headless coupled runner (coupled-run)"

[tasks.scenarios]
depends = ["scenario:build"]
run = "uv run python tools/coupled.py scenario --all --no-build"
description = "Run every DN2 scenario; exits non-zero when a pinned PCM hash differs. DT2: uv run python tools/coupled.py scenario --all --device dt2"

[tasks."scenarios:check"]
run = "uv run python -m pytest tests/scenarios --slow -q"
description = "Oracle tests: render the DN2 FX scenarios headless and assert measured relationships (fast subset, about 3 min)"

[tasks."scenarios:dt2"]
run = "uv run python -m pytest tests/scenarios/test_dt2_fx.py --device dt2 --slow --sweep -q"
description = "Oracle tests for the DT2 FX scenarios on the one-sample card (about 2 min)"

[tasks."scenarios:sweep"]
run = "uv run python -m pytest tests/scenarios --slow --sweep -q"
description = "Oracle tests with the full sweeps (every track FX and send FX scenario, about 20 min)"

[tasks.verify]
run = "uv run python tools/verify.py"
description = "Exactness gate, quick: build, DN2 pins, scenarios:check (one PASS/FAIL line per step; logs in out/runs/verify/)"

[tasks."verify:full"]
run = "uv run python tools/verify.py --full"
description = "Exactness gate, full: + no-AOT suite, 134-scenario tier sweep, Python and Rust tests, DT2 tone (about 30 min)"

[tasks.scenario]
run = "uv run python tools/coupled.py scenario"
description = "Run headless coupled scenarios: mise run scenario trig1-taps [--wav]"

[tasks."scenario:replay"]
alias = "replay"
run = "uv run python tools/coupled.py replay"
description = "Replay inputs recorded by the desktop app (Export diagnostics file) headless"

[tasks."scenario:bisect"]
alias = "bisect"
run = "uv run python tools/coupled.py bisect"
description = "Find the DSP tier (fast region, cluster root, AOT) that changes a scenario's PCM"

# --- tests ---

[tasks."test:quick"]
run = [
  "uv run python -m pytest -q tests/test_native_emu_launcher.py tests/test_native_pgo.py tests/test_native_target.py tests/test_coupled_tool.py",
  "uv run python tools/coupled.py test-quick",
]
description = "Fast checks for the tooling, the audio sink and the coupled runtime"

[tasks.test]
run = [
  "uv run python -m pytest -q tests",
  "uv run python tools/rust_ws.py test",
  "pnpm test",
  "uv run python tools/coupled.py scenario --all",
]
description = "Everything except the slow gates: pytest, cargo test --workspace, web tests, every DN2 scenario pin"

[tasks."test:slow"]
run = [
  "uv run python -m pytest -q tests --slow",
  "uv run python tools/rust_ws.py gates",
]
description = "Slow pytest runs and the ignored Rust gates that have private fixtures (coupled_ready_exactness)"

# --- lint ---

[tasks."lint:py"]
run = "uv run python -m pytest -q tests/test_lint.py"
description = "ruff check and ruff format --check on the CLEAN list of tests/test_lint.py"

[tasks."lint:web"]
run = "pnpm lint"
description = "Lint the web panel (oxlint with eslint-plugin-solid)"

[tasks."lint:rust"]
run = "uv run python tools/rust_ws.py fmt"
description = "cargo fmt --check on the crates that are already clean (CLEAN_CRATES in tools/rust_ws.py)"

[tasks.lint]
depends = ["lint:py", "lint:web", "lint:rust"]
description = "All linters"

[tasks.check]
depends = ["lint", "test:quick"]
description = "The pre-merge gate: lint + test:quick"

# --- performance ---

[tasks.perf]
run = "uv run python tools/perf.py"
description = "Standard DSP performance report (coverage, CPU per audio s, PCM, calls, per-function cost ranking): mise run perf -- [--config NAME] [--seconds S] [--timed] [--calibrate]"

[tasks."perf:cov"]
alias = "fastcov"
run = "uv run python tools/fastcov.py"
description = "DSP CPU, tier split and fast-tier refusals/exits per tier config: mise run perf:cov -- --config default --config fast-auto"

[tasks."perf:pgo"]
alias = "pgo"
run = "uv run python tools/native_pgo.py train"
description = "Retrain the desktop PGO profile (~6 min); do it at milestones, not per edit"

[tasks."perf:aot"]
alias = "aot-gen"
run = "uv run python tools/aot_gen.py"
description = "Generate a firmware block library (AOT core) and register it by DSP image: mise run perf:aot -- dt2 --card-image IMG"

# --- generated SHARC core ---

[tasks."gen:core"]
alias = "core"
run = "uv run python tools/sharc_transpile.py --strict --out out/native/shared-core/gen --work out/native/shared-core/work"
description = "Write the firmware-independent SHARC core (no blocks, no image) to out/native/shared-core/gen: build with SHARC_GEN_DIR pointing there"

[tasks."gen:regen"]
alias = "regen"
run = "uv run python tools/sharc_lowergen_regen.py"
description = "Regenerate the shared core, native/sharc/src/fast/lower/gen_forms.rs, the fuzz vectors and the test programs from tools/sharc_core: mise run gen:regen [-- --add FORM,...]"

# --- developer tools ---

[tasks."dev:boot"]
alias = "boot"
run = "tools/native_boot.py"
description = "Run the bounded native Oracle boot diagnostic"

[tasks."dev:plusdrive"]
alias = "plusdrive"
run = "tools/native_plusdrive.py"
description = "Build or inspect a standalone +Drive image"
