# Toolchains for the native SHARC core (native/). Python stays on uv.

[settings]
activate_aggressive = true

[tools]
rust = "1.98.1"
pnpm = "12.8.2"

[tasks.boot]
run = "tools/native_boot.sh"
description = "Run the bounded native Oracle boot diagnostic"

[tasks.plusdrive]
run = "tools/native_plusdrive.sh"
description = "Build or inspect a standalone +Drive image"

[tasks.emu]
run = "tools/native_emu.sh"
description = "Build once and run the desktop emulator (DN2 audio when local inputs are ready)"

[tasks."emu:serve"]
run = "tools/native_emu.sh --daemon"
description = "Run the emulator without a window, paused, serving the control socket (out/native/run/current.json); drive it with tools/digi_client.py. --free runs it live."

[tasks."emu:ctl"]
run = "uv run python tools/digi_client.py"
description = "Control a running emulator: mise run emu:ctl status | inject PATCHED.syx | step N | tap CODE | frame out.png | call METHOD k=v | events"

[tasks."emu:build"]
run = "tools/native_emu.sh --build-only"
description = "Build the desktop emulator exactly as `mise run emu` does, without launching it"

[tasks.web]
run = "pnpm dev"
description = "Build the browser core (WASM) and serve the web panel (astro dev)"

[tasks.wasm]
run = "tools/native_wasm.sh"
description = "Build only the browser emulator core (WASM)"

[tasks."wasm:parity"]
run = "node tools/wasm_parity.mjs --scenario"
description = "Check the browser core renders a scenario's PCM byte-identical to native: mise run wasm:parity trig1-tap-release"

[tasks.pgo]
run = "uv run python tools/native_pgo.py train"
description = "Retrain the desktop PGO profile (~6 min); do it at milestones, not per edit"

[tasks.scenario]
run = "uv run python tools/coupled.py scenario"
description = "Run headless coupled scenarios: mise run scenario trig1-taps [--wav]"

[tasks.fastcov]
run = "uv run python tools/fastcov.py"
description = "DSP CPU, tier split and fast-tier refusals/exits per tier config: mise run fastcov -- --config default --config fast-auto"

[tasks.core]
run = "uv run python tools/sharc_transpile.py --strict --out out/native/shared-core/gen --work out/native/shared-core/work"
description = "Write the firmware-independent SHARC core (no blocks, no image) to out/native/shared-core/gen: build with SHARC_GEN_DIR pointing there"

[tasks.replay]
run = "uv run python tools/coupled.py replay"
description = "Replay inputs recorded by the desktop app (Export diagnostics file) headless"

[tasks.bisect]
run = "uv run python tools/coupled.py bisect"
description = "Find the DSP tier (fast region, cluster root, AOT) that changes a scenario's PCM"

[tasks."test:quick"]
run = [
  "uv run python -m pytest -q tests/test_native_emu_launcher.py tests/test_native_pgo.py tests/test_native_target.py tests/test_coupled_tool.py",
  "uv run python tools/coupled.py test-quick",
]
description = "Fast checks for the tooling, the audio sink and the coupled runtime"

[tasks.ready]
run = "uv run python tools/ready.py"
description = "Build a device's ready snapshot from the .syx alone: mise run ready -- dn2|dt2 [--card-image IMG] (cold DSP start; about 2 min)"

[tasks."aot-gen"]
run = "uv run python tools/aot_gen.py"
description = "Generate a firmware block library (AOT core) and register it by DSP image: mise run aot-gen -- dt2 --card-image IMG"
