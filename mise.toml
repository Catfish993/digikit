# Toolchains for the native SHARC core (native/). Python stays on uv.
# Groups: setup, emu*, web*, scenario*, test*, lint*, perf*, gen:*, dev:*, check,
# verify*, toolchains, patch*, port:*, inject.
# Old task names stay as aliases.

[settings]
activate_aggressive = true

[tools]
rust = "1.98.1"
node = "24.15.0"
pnpm = "12.8.2"
"aqua:WebAssembly/binaryen" = "version_133"
wasm-tools = "1.261.0"
"github:mstange/samply" = "samply-v0.13.1"

# --- setup ---

[tasks.setup]
run = [
  "uv sync",
  "pnpm install --frozen-lockfile",
]
description = "Install the Python and web dependencies"

# --- desktop emulator ---

[tasks.emu]
run = "uv run python -m tools.emulator.native_emu"
description = "Build once and run the desktop emulator (DN2 audio when local inputs are ready); `-- --build-only` builds without launching"

[tasks."emu:serve"]
run = "uv run python -m tools.emulator.native_emu --daemon"
description = "Run the emulator without a window, paused, serving the control socket (out/native/run/current.json); drive it with tools/control/digi_client.py. --free runs it live."

[tasks."emu:ctl"]
run = "uv run python -m tools.control.digi_client"
description = "Control a running emulator: mise run emu:ctl status | inject PATCHED.syx | step N | tap CODE | frame out.png | call METHOD k=v | events"

[tasks."emu:ready"]
alias = "ready"
run = "uv run python -m tools.emulator.ready"
description = "Build a device's ready snapshot from the .syx alone: mise run emu:ready -- dn2|dt2 [--card-image IMG] (cold DSP start; about 2 min)"

# --- web panel ---

[tasks.web]
run = "pnpm dev"
description = "Build the browser core (WASM) and serve the web panel (astro dev)"

[tasks."web:build"]
run = "pnpm build"
description = "Build the browser core (WASM) and the static web panel (astro build, with the firmware guard)"

[tasks."web:check"]
run = "pnpm check"
description = "Type-check the web panel (astro check)"

[tasks."web:test"]
run = "pnpm test"
description = "Run the web panel's audio-health tests (node --test)"

[tasks."web:wasm"]
run = "python3 -m tools.emulator.native_wasm"
description = "Build only the browser emulator core (WASM); the coupled core goes through wasm-opt -O3 (--wasm-opt= turns it off)"

[tasks."web:bench"]
run = "uv run python -m tools.devtools.benchlock run --exclusive -- node tools/devtools/browser_bench.mjs"
description = "Headless Chrome throughput bench of the coupled browser core (needs local inputs): mise run web:bench -- --seconds 10 --runs 3 [--js-flags=--no-liftoff] [--profile]"

[tasks."web:parity"]
run = "node tools/devtools/wasm_parity.mjs --scenario"
description = "Check the browser core renders a scenario's PCM byte-identical to native: mise run web:parity trig1-tap-release"

# --- scenarios (tests/scenarios/README.md) ---

[tasks."scenario:build"]
run = "uv run python -m tools.emulator.coupled build"
description = "Build the headless coupled runner (coupled-run)"

[tasks.scenarios]
depends = ["scenario:build"]
run = "uv run python -m tools.emulator.coupled scenario --all --no-build"
description = "Run every DN2 scenario; exits non-zero when a pinned PCM hash differs. DT2: uv run python -m tools.emulator.coupled scenario --all --device dt2"

[tasks."scenarios:check"]
run = "uv run python -m pytest tests/scenarios --slow -q"
description = "Oracle tests: render the DN2 FX scenarios headless and assert measured relationships (fast subset, about 3 min)"

[tasks."scenarios:dt2"]
run = "uv run python -m pytest tests/scenarios/test_dt2_fx.py --device dt2 --slow --sweep -q"
description = "Oracle tests for the DT2 FX scenarios on the one-sample card (about 2 min)"

[tasks."scenarios:sweep"]
run = "uv run python -m pytest tests/scenarios --slow --sweep -q"
description = "Oracle tests with the full sweeps (every track FX and send FX scenario, about 20 min)"

[tasks.verify]
run = "uv run python -m tools.devtools.verify"
description = "Exactness gate for what changed (tools/devtools/verify.py; --base BRANCH in a lane, --only STEPS, --explain shows the routing and the plan without running); one PASS/FAIL line per step, logs in out/runs/verify/"

[tasks."verify:full"]
run = "uv run python -m tools.devtools.verify --full"
description = "Exactness gate, every step with the full 134-scenario tier sweep (about 20 min with warm builds): before merging to main"

[tasks.scenario]
run = "uv run python -m tools.emulator.coupled scenario"
description = "Run headless coupled scenarios: mise run scenario trig1-taps [--wav]"

[tasks."scenario:replay"]
alias = "replay"
run = "uv run python -m tools.emulator.coupled replay"
description = "Replay inputs recorded by the desktop app (Export diagnostics file) headless"

[tasks."scenario:bisect"]
run = "uv run python -m tools.emulator.coupled bisect"
description = "Find the DSP tier (fast region, cluster root, AOT) that changes a scenario's PCM"

# --- tests ---

[tasks."test:quick"]
run = [
  "uv run python -m pytest -q tests/emulator/test_native_emu_launcher.py tests/emulator/test_native_pgo.py tests/emulator/test_native_target.py tests/emulator/test_coupled_tool.py",
  "uv run python -m tools.emulator.coupled test-quick",
]
description = "Fast checks for the tooling, the audio sink and the coupled runtime"

[tasks.test]
run = [
  "uv run python -m tools.devtools.test_outcomes run --check --out out/runs/tests/latest tests",
  "uv run python -m tools.devtools.rust_ws test",
  "pnpm test",
  "uv run python -m tools.emulator.coupled scenario --all",
]
description = "Everything except the slow gates: Python tests (tools/devtools/test_outcomes.py run: one process per file, in parallel, so a state leak between files cannot fail unrelated tests, see docs/TESTING.md), cargo test --workspace, web tests, every DN2 scenario pin"

[tasks."test:slow"]
run = [
  "uv run python -m tools.devtools.test_outcomes run --check --timeout 3600 --out out/runs/tests/latest-slow --pytest-arg=--slow tests",
  "uv run python -m tools.devtools.rust_ws gates",
]
description = "Slow pytest runs and the ignored Rust gates that have private fixtures (coupled_ready_exactness)"

# --- lint ---

[tasks."lint:py"]
run = "uv run python -m pytest -q tests/devtools/test_lint.py"
description = "ruff check and ruff format --check on the CLEAN list of tests/devtools/test_lint.py"

[tasks."lint:web"]
run = "pnpm lint"
description = "Lint the JS/TS workspaces (oxlint with eslint-plugin-solid)"

[tasks."fmt:web"]
run = "pnpm fmt:check"
description = "Check JS/TS/Astro/CSS formatting (Prettier)"

[tasks.fmt]
run = "pnpm fmt"
description = "Format JS/TS/Astro/CSS in place (Prettier)"

[tasks."lint:rust"]
run = "uv run python -m tools.devtools.rust_ws fmt"
description = "cargo fmt --check on the crates that are already clean (CLEAN_CRATES in tools/devtools/rust_ws.py)"

[tasks.lint]
depends = ["lint:py", "lint:web", "fmt:web", "lint:rust"]
description = "All linters"

[tasks.check]
depends = ["lint", "test:quick"]
description = "Quick local check (lint + test:quick), not the merge gate: use `mise run verify` for what changed and `mise run verify:full` before merging to main"

# --- performance ---

[tasks.perf]
run = "uv run python -m tools.devtools.perf"
description = "Standard DSP performance report (coverage, CPU per audio s, PCM, calls, per-function cost ranking): mise run perf -- [--config NAME] [--seconds S] [--timed] [--calibrate]"

[tasks."perf:cov"]
alias = "fastcov"
run = "uv run python -m tools.devtools.fastcov"
description = "DSP CPU, tier split and fast-tier refusals/exits per tier config: mise run perf:cov -- --config default --config fast-auto"

[tasks."pgo:dn2"]
run = "uv run python -m tools.emulator.native_pgo train"
description = "Retrain the DN2 PGO profile against the current code and generated core"

[tasks."pgo:dt2"]
run = "uv run python -m tools.emulator.native_pgo train --device dt2"
description = "Retrain the DT2 PGO profile against the current code and generated core"

[tasks."perf:pgo"]
alias = "pgo"
run = [
  "uv run python -m tools.emulator.native_pgo train",
  "uv run python -m tools.emulator.native_pgo train --device dt2",
  "uv run python -m tools.emulator.native_emu --build-only",
]
description = "Retrain DN2 and DT2 PGO profiles, then rebuild the launcher with PGO. Run after core or engine changes, when `mise run emu` reports a stale profile."

[tasks."perf:aot"]
alias = "aot-gen"
run = "uv run python -m tools.sharc_dev.aot_gen"
description = "Generate a firmware block library (AOT core) and register it by DSP image: mise run perf:aot -- dt2 --card-image IMG"

# --- generated SHARC core ---

[tasks."gen:core"]
alias = "core"
run = "uv run python -m tools.sharc_dev.sharc_transpile --strict --out out/native/shared-core/gen --work out/native/shared-core/work"
description = "Write the firmware-independent SHARC core (no blocks, no image) to out/native/shared-core/gen: build with SHARC_GEN_DIR pointing there"

[tasks."sharc:native-lib"]
depends = ["gen:core"]
run = "uv run python -m tools.sharc_dev.sharc_native_lib"
description = "Build the firmware-free native SHARC library (shared core) that tests/sharc/semantics and generation load; no firmware needed; out/native/shared-core/target"

[tasks."gen:regen"]
alias = "regen"
run = "uv run python -m tools.sharc_dev.sharc_lowergen_regen"
description = "Regenerate the shared core, packages/emulator/sharc/src/fast/lower/gen_forms.rs, the fuzz vectors and the test programs from tools/sharc_dev/sharc_core: mise run gen:regen [-- --add FORM,...]"

# --- developer tools ---

[tasks."dev:boot"]
alias = "boot"
run = "python3 -m tools.emulator.native_boot"
description = "Run the bounded native Oracle boot diagnostic"

[tasks."dev:plusdrive"]
alias = "plusdrive"
run = "cargo run --release --locked --offline -p plusdrive-format --bin plusdrive --"
description = "Build or inspect a standalone +Drive image"

# --- patchkit toolchains (installed under out/tools, never global) ---

[tasks."toolchains"]
run = [
  "uv run python -m tools.patchkit.pk_toolchains m68k",
  "uv run python -m tools.patchkit.pk_toolchains selache",
]
description = "Build the pinned m68k-elf binutils/gcc (about 15 min) and Selache into out/tools"

# --- patchkit: firmware modules (docs/plans/patchkit.md) ---

[tasks."patch"]
run = "uv run python -m tools.patchkit.patchkit patch"
description = "Apply modules to a stock firmware: mise run patch -- --firmware X.syx --modules a,b [-o OUT.syx] (writes out/patch/ and plan.json)"

[tasks."patch:build"]
run = "uv run python -m tools.patchkit.pk_build"
description = "Compile module sources to build/*.dko.json: mise run patch:build [-- modules/fx/NAME] [--check]"

[tasks."patch:explain"]
run = "uv run python -m tools.patchkit.patchkit explain"
description = "Site-by-site account of a patch (disassembly before and after, allocation map): mise run patch:explain -- --firmware X.syx --modules a,b"

[tasks."patch:new"]
run = "uv run python -m tools.patchkit.pk_new"
description = "Create a module from a template: mise run patch:new -- category/name [--cf] [--dsp] (stubs, tests/smoke.toml, gallery/README.md; builds it)"

[tasks."patch:dev"]
run = "uv run python -m tools.patchkit.pk_dev"
description = "Developer loop: mise run patch:dev -- --modules a,b [--device dt2|dn2] [--once]; watches src/ and module.toml, rebuilds, patches, injects into a running emulator, runs the quick tests, one summary line per edit"

[tasks."patch:mem"]
run = "uv run python -m tools.patchkit.pk_mem"
description = "Patch memory per region (size, used by each module, free), refused when the modules do not fit: mise run patch:mem -- fx/master-gain machines/pluck [--device dt2|dn2] [--firmware VER] [--json]"

[tasks."patch:test"]
run = "uv run python -m tools.patchkit.pk_harness run"
description = "Smoke tour and module tests over the matrix (tests/patchkit/smoke/matrix.toml): mise run patch:test [-- --matrix FILE | --cell dt2-1.17:fx/master-gain | --update]; one PASS/FAIL line per cell, logs in out/runs/patchkit/"

[tasks."patch:proofs"]
run = "uv run python -m tools.patchkit.pk_proofs"
description = "Every emulator proof on its quick tier, in sequence (DT2: gain, drive, voice, machines, pluck; DN2: gain, voice, machines, pages, pluck; drive runs on DT2 only): mise run patch:proofs [-- --only pluck,machines --jobs N]; one PASS/FAIL line per tool and a total, logs in out/runs/proofs"

[tasks."port:resolve"]
run = "uv run python -m tools.patchkit.port_resolve"
description = "Resolve the anchors and regions of a firmware into devices/ports/*.toml: mise run port:resolve [-- X.syx] (no argument: the four supported firmwares)"

[tasks."inject"]
run = "uv run python -m tools.patchkit.patchkit inject"
description = "Load a patched image into the running emulator (emu:ctl inject): mise run inject [-- OUT.syx] [--hot]"
