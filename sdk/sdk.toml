# The module contract: version numbers, log kinds and the SysEx protocol numbers. `patchkit gen` writes
# modules/core/runtime/sdk/src/gen_sdk.rs, tools/device/dklog_kinds.py, tools/device/dkproto.py and
# packages/dkupload/src/gen_proto.rs from this file (`patchkit gen --check` fails when they are stale).

[runtime]           # the digikit runtime release (semantic version; packed major<<16 | minor<<8 | patch)
version = "0.2.3"   # 0.x: MINOR may break (contract major, store format, SysEx protocol), PATCH = features and fixes

[contract]          # [major, minor] per contract (docs/design/module-sdk.md 11.5 D3). The runtime refuses a module that declares a
                    # contract (major != 0) when its major differs from the runtime's or its minor is above the runtime's. Major 0 = not implemented.
                    # An appended Api function is a minor bump; a changed or removed one is a major bump.
api = [1, 1]        # the ColdFire Api table (every module, `raw` included); minor 1: `log_lv` appended
machine = [1, 0]
fx = [0, 0]         # no FX contract yet: a module that declares fx is always refused
service = [1, 0]

# The machine contract's numbers (sdk/dk_machine.h is the hand-written C view; packages/patchkit/tests/sdkgen.rs keeps the two equal).
# `patchkit gen` writes sdk/dk_machine.inc from this table: the constants, then the byte and word offsets of the fields (all 4 bytes).
[machine]
consts = [
    { name = "DK_MACHINE_V1", value = 1 },
    { name = "DK_BLOCK", value = 32 },
    { name = "DK_MAX_PARAMS", value = 8 },
    { name = "DK_MAX_VOICES", value = 16 },
    { name = "DK_OK", value = 0 },
    { name = "DK_DONE", value = 1 },
    { name = "DK_P_PERCENT", value = 0 },
    { name = "DK_P_BIPOLAR", value = 1 },
    { name = "DK_P_ENUM", value = 2 },
    { name = "DK_P_PITCH", value = 3 },
    { name = "DK_LEVEL_BOUND_BITS", value = 1090519040 },  # 8.0f
    { name = "DK_MAGIC", value = 1145785665 },             # 'DKMA' = 0x444b4d41
]
voice_in = ["pitch", "velocity", "block", "out"]           # struct dk_voice_in, DK_IN_*
desc = [
    "magic", "contract", "n_params", "voices", "state_bytes",
    "state_clear_bytes", "max_cycles_block", "max_cycles_note_on", "max_call_depth", "stack_bytes",
]                                                          # struct dk_machine_desc, DK_DESC_*

# The FX contract's numbers (sdk/dk_fx.h is the hand-written C view; packages/patchkit/tests/sdkgen.rs keeps the two equal).
# `patchkit gen` writes sdk/dk_fx.inc from this table. Do not include it together with dk_machine.inc (DK_BLOCK and DK_LEVEL_BOUND_BITS are in both).
[fx]
consts = [
    { name = "DK_FX_V1", value = 1 },
    { name = "DK_BLOCK", value = 32 },
    { name = "DK_FX_BLOCK", value = 64 },                  # floats of the master block: 32 left, then 32 right
    { name = "DK_FX_MAX_PARAMS", value = 4 },
    { name = "DK_FX_MAX", value = 4 },                     # effects in the chain
    { name = "DK_FX_OK", value = 0 },
    { name = "DK_LEVEL_BOUND_BITS", value = 1090519040 },  # 8.0f
    { name = "DK_FX_MAGIC", value = 1145783896 },          # 'DKFX' = 0x444b4658
]
fx_in = ["in", "out", "block"]                             # struct dk_fx_in, DK_FX_IN_*
desc = [
    "magic", "contract", "n_params", "state_bytes", "max_cycles_block", "max_call_depth", "stack_bytes",
]                                                          # struct dk_fx_desc, DK_FX_DESC_*

[log]
f_error = 1        # flags bit 0: error (kept even when debug is off)
level_shift = 1     # flags bits 1-3: level 0 error, 1 warn, 2 info, 3 debug, 4 trace
level_mask = 7
source_shift = 8    # flags bits 8-15: source module (0 = runtime, n = module table index + 1)
source_mask = 255

# Other constants of the Rust `logk` module (u32).
[log.consts]
MENU_SELECT = 1     # `MENU` argument 0: what the menu did
MENU_RESTART = 2
MENU_DEBUG = 3

# `MACHINE_FAULT` argument 1, low byte: what the DSP guard found.
[log.guard_kinds]
1 = "nonfinite"
2 = "overlevel"

# args: dklog's 5 argument names, "-" = not shown.
