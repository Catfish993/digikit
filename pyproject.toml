[project]
name = "digitakt2"
version = "0.1.0"
description = "Digitakt II / Digitone II firmware tooling: container, ColdFire and SHARC+ analysis, and the build tools for the native emulator"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "capstone==5.0.7",
    "pypcode==4.0.0",
    "networkx==3.4.2",
]

# Pinned to 3.12 deliberately: on 3.14 binary wheels are still thin.

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "mypy==2.3.1",
    "numpy>=2.5.3",
    "pytest>=8",
    "ruff==0.16.9",
]

[tool.uv]
package = false

# Pinned here so ruff gives the same answer on every machine, whatever the
# user-level ruff configuration says. tests/devtools/test_lint.py enforces these rules
# and the formatter on the files listed there; add a file to that list when
# you clean it.
[tool.ruff]
line-length = 88
target-version = "py312"
# tools/ modules import each other as top-level modules (sys.path setup).
src = [".", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",   # line length is the formatter's job
    "UP031",  # %-formatting is the house style
]

# tests/devtools/test_types.py runs mypy on the files listed there. The SHARC core
# also runs under PyPy, which supports Python 3.11, so check against 3.11.
[tool.mypy]
python_version = "3.11"
mypy_path = "tools"
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "silent"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "matplotlib", "matplotlib.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
