[module]
id = "digikit/remote"
version = "0.1.0"
name = "Remote control"
category = "tools"
type = "service"
author = "digikit"
status = "experimental"
summary = "Presses keys and turns encoders of the device from a computer over USB MIDI (KEY, TURN, RELEASE, STATE); the DIGIKIT menu's REMOTE switch must be on"
ports = ["dt2-1.17", "dn2-1.12"]
requires = ["core/input"]
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# A run-time module (`.dkm`, `patchkit pack digikit/remote --device dt2`): its dkm_init registers the remote range of sdk/sdk.toml with Api.register_cmds
# and calls core/input's `input_key` and `input_turn` (runtime imports). The runtime refuses the guarded range with E_DISABLED while DIGIKIT > REMOTE is off.
[[object]]
path = "build/remote.dko.json"
sources = ["src/c/remote.c"]
place = "cf.expansion"
