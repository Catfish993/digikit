[module]
id = "fadedlimes/pd"
version = "0.1.0"
name = "Phase Dist"
category = "machines"
type = "machine"
author = "fadedlimes"
status = "experimental"
summary = "One continuous slider warps the phase a sine is read through: saw, pulse, or a resonant formant."
dynamic = false
ports = ["dt2-1.17"]
requires = []
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "unsupported"

[[object]]
path = "build/pd-dsp.dko.json"
sources = ["src/dsp/pd.s"]
place = "dsp.l2"

[[voice]]
machine = "pd"
render = "_pd_render"
note_on = "_pd_note_on"
desc = "_pd_desc"

# SAMPLE's TUNE (0xca) and LEV (0xd1) at the ends. The DSP reads params[i] from the knob at param_slots[i]
# (Digitakt II 1.17: 1, 2, 4, 5). The positions in knobs below also set the UI slot, the p-lock slot, the frame
# offsets and the generated files, so they must equal param_slots.
[[machine]]
id = "pd"
name = "Phase Dist"
short = "PD"
clone_of = 0
knobs = ["pd_amount", "pd_curve", "pd_detune", "pd_fold"]

[[param]]
id = "pd_amount"
name = "Distortion"
short = "PD"
min = 0
max = 0x7f00
default = 0x0000

[[param]]
id = "pd_curve"
name = "Curve"
short = "CURVE"
min = 0
max = 0x7f00
default = 0x0000

[[param]]
id = "pd_detune"
name = "Detune"
short = "DET"
min = 0
max = 0x7f00
default = 0x2800

[[param]]
id = "pd_fold"
name = "Fold"
short = "FOLD"
min = 0
max = 0x7f00
default = 0x0000
