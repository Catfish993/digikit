[module]
id = "digikit/pluck"
version = "0.1.0"
name = "PLUCK"
category = "machines"
type = "machine"
author = "digikit"
status = "experimental"
summary = "A plucked-string synth machine with decay, pick position, brightness and colour, loaded at run time."
dynamic = true
ports = ["dt2-1.16", "dt2-1.17", "dn2-1.11", "dn2-1.12"]
requires = []
conflicts = []

[targets]
"dt2-1.16" = "experimental"
"dt2-1.17" = "experimental"
"dn2-1.11" = "experimental"
"dn2-1.12" = "experimental"

# A machine loaded at run time (docs/findings/32-runtime-dsp-machines.md). `patchkit pack digikit/pluck --device dt2 -o ...dkm` lowers the
# typed sections below into the `register` records and links the DSP object into the `.dkm` DSP section; the digikit runtime sends the code
# to the DSP and publishes the voice row (type 18 on the Digitakt II, 17 on the Digitone II) and the machine row.
# The patched-in twin test/patched-pluck (tests/fixtures/modules) builds from the same source file (one body for both devices), so the
# routine that runs is the same in both.
[[object]]
path = "build/pluck-dsp.dko.json"
sources = ["src/dsp/pluck.s"]
place = "dsp.l2"

[[voice]]
machine = "pluck"
render = "_pk_render"
note_on = "_pk_note_on"
desc = "_pk_desc"

[[machine]]
id = "pluck"
name = "Pluck"
short = "PLK"
clone_of = 0
knobs = [0xca, "pluck_decay", "pluck_pick", 0, "pluck_bright", "pluck_color", 0, 0xd1]

# Digitone II: a machine of its own type (own_dsp) with its own SYN page: DECAY, PICK, BRIGHT, COLOR on knobs A .. D.
[machine.dt2]
type_hint = 18   # the numbers these machines had before sticky ids (finding 52)

[machine.dn2]
type_hint = 17
own_dsp = true
knobs = ["pluck_decay", "pluck_pick", "pluck_bright", "pluck_color"]

[[param]]
id = "pluck_decay"
name = "Decay"
short = "DECAY"
template = 0xd1
min = 0
max = 0x7f00
default = 0x4000

[param.dn2]
template = 0xd5

[[param]]
id = "pluck_pick"
name = "Pick position"
short = "PICK"
template = 0xd1
min = 0
max = 0x7f00
default = 0x2000

[param.dn2]
template = 0xd5

[[param]]
id = "pluck_bright"
name = "Brightness"
short = "BRIGHT"
template = 0xd1
min = 0
max = 0x7f00
default = 0x5000

[param.dn2]
template = 0xd5

[[param]]
id = "pluck_color"
name = "Excitation colour"
short = "COLOR"
template = 0xd1
min = 0
max = 0x7f00
default = 0x2800

[param.dn2]
template = 0xd5

[[page]]
id = "pluck_syn"
machine = "pluck"
name = "PLUCK"
title = "Pluck"
devices = ["dn2"]
