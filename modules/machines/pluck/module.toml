[module]
id = "machines/pluck"
version = "0.1.0"
name = "Pluck"
category = "machines"
status = "experimental"
summary = "PLUCK machine: a Karplus-Strong plucked string, one per track, tuned to the note, with decay, pick position, brightness and colour knobs on the SRC page"
ports = ["dt2-1.16", "dt2-1.17"]
requires = ["core/dsp-voice", "core/machines", "core/params"]
conflicts = []

[targets]
"dt2-1.16" = "untested"
"dt2-1.17" = "experimental"
"dn2-1.11" = "untested"
"dn2-1.12" = "untested"

[[object]]
path = "build/pluck-dsp.dko.json"
sources = ["src/dsp/pluck.s"]
place = "dsp.l2"
devices = ["dt2"]

# The DSP routine renders the type core/machines assigns to this machine (`machines.pluck.index`).
[[entry]]
registry = "voices"
id = "pluck"
type = "machines.pluck.index"
pc = "_pk_render"
devices = ["dt2"]

# The machine clones SAMPLE (type 0: its permission, per-type byte and DSP selector, so the track plays through the
# sample renderer where the voice hook takes over). The SRC page: engine slots 0 TUNE and 7 LEV are SAMPLE's own
# rows, 1 DECAY, 2 PICK, 4 BRIGHT, 5 COLOR are rows this module adds (core/params); slots 3 and 6 stay empty.
# Values are 0 .. 0x7f00 (UI 0 .. 127); the defaults give a medium-length, slightly damped, lightly combed pluck.
[[entry]]
registry = "machines"
id = "pluck"
name = "Pluck"
short = "PLK"
clone_of = 0
f0 = 0xca
f1 = "params.pluck_decay.index"
f2 = "params.pluck_pick.index"
f3 = 0
f4 = "params.pluck_bright.index"
f5 = "params.pluck_color.index"
f6 = 0
f7 = 0xd1
f8 = 0x0a
devices = ["dt2"]

[[entry]]
registry = "params"
id = "pluck_decay"
name = "Decay"
short = "DECAY"
template = 0xd1
slot = 1
min = 0
max = 0x7f00
default = 0x4000

[[entry]]
registry = "params"
id = "pluck_pick"
name = "Pick position"
short = "PICK"
template = 0xd1
slot = 2
min = 0
max = 0x7f00
default = 0x2000

[[entry]]
registry = "params"
id = "pluck_bright"
name = "Brightness"
short = "BRIGHT"
template = 0xd1
slot = 4
min = 0
max = 0x7f00
default = 0x5000

[[entry]]
registry = "params"
id = "pluck_color"
name = "Excitation colour"
short = "COLOR"
template = 0xd1
slot = 5
min = 0
max = 0x7f00
default = 0x2800
