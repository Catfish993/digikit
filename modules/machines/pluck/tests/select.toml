# PLUCK is the 8th entry of the machine list; YES commits type 7 (the track object, byte 0x4265338e), the SRC page opens with the module's knobs, a trig sounds (a plucked string) and the DSP's type cache (DM 0x255970) holds 7.

[test]
name = "select_pluck"
devices = ["dt2"]
quick = true

[[step]]
wait_ms = 1500
[[step]]
tap = ["FUNC", "SRC"]
[[step]]
wait_ms = 200
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
expect_frame = "list"
[[step]]
tap = "YES"
[[step]]
wait_ms = 0x12c
[[step]]
expect_mem = { addr = 0x4265338c, mask = 0xff00, eq = 0x700 }
[[step]]
tap = "YES"
[[step]]
wait_ms = 0x12c
[[step]]
tap = "SRC"
[[step]]
wait_ms = 0x12c
[[step]]
expect_frame = "src_page"
[[step]]
tap = "TRIG 1"
[[step]]
wait_ms = 0x1f4
[[step]]
expect_pcm_db = { min = -60, max = -3 }
[[step]]
expect_dsp = { addr = 0x255970, hex = "07" }
[[step]]
expect_no_fault = true
[[step]]
turn = "ENC E"
by = 4
events = 30
[[step]]
wait_ms = 100
[[step]]
expect_frame = "bright_moved"
differs_from = "src_page"
[[step]]
expect_no_fault = true
