# EDGE is the 5th entry of the machine list (before MIDI); YES commits type 5, which the DSP receives as it is; after a
# TRIG the audio mirror (SRAM 0x8000487c, first byte) holds 5, the TX frame sends type 5 (own_dsp) and the voice sounds.

[test]
name = "select_edge"
devices = ["dn2"]
quick = true

[[step]]
wait_ms = 1500
[[step]]
tap = ["FUNC", "SRC"]
[[step]]
wait_ms = 300
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "YES"
[[step]]
wait_ms = 300
[[step]]
tap = "YES"
[[step]]
wait_ms = 300
[[step]]
tap = "TRIG 1"
[[step]]
wait_ms = 500
[[step]]
expect_mem = { addr = 0x8000487c, mask = 0xff000000, eq = 0x5000000 }
[[step]]
expect_mem = { addr = 0x80005ef4, mask = 0xffff0000, eq = 0x50000 }
[[step]]
expect_pcm_db = { min = -120, max = 0 }
[[step]]
expect_no_fault = true
