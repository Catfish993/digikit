[module]
id = "test/dn2-edge"
version = "0.1.0"
name = "Edge probe (Digitone II)"
category = "test"
status = "experimental"
summary = "Research probe for the Digitone II voice hook: writes a click into the voice buffer for every trig and release pulse the frame carries (finding 06, note-on edge)"
ports = ["dn2-1.11", "dn2-1.12"]
requires = ["core/machines", "core/dsp-voice"]
conflicts = []

[targets]
"dn2-1.12" = "experimental"

# The machine: its own type (5), listed before MIDI, sent to the DSP as it is (`own_dsp`); the page layout, parameters
# and names are FM TONE's (clone_of = 0).
[[machine]]
id = "dn2edge"
name = "Edge"
short = "EDG"
clone_of = 0
position = 4
fields = [0, 0, 0, 0, 0, 0, 0, 0, 10]
own_dsp = true

[[object]]
path = "build/edge-probe-dn2-dsp.dko.json"
sources = ["src/dsp/edge_probe_dn2.s"]
place = "dsp.l2"
devices = ["dn2"]

[[op]]
op = "register"
table = "_dv_table"
row = ["machines.dn2edge.type", "_ed_render"]
devices = ["dn2"]
