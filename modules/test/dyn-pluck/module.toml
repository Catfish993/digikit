[module]
id = "test/dyn-pluck"
version = "0.1.0"
name = "PLUCK-D"
category = "test"
status = "experimental"
summary = "machines/pluck as a run-time module: the machine rows from the typed sections and the pluck DSP routine, loaded by the digikit runtime."
dynamic = true
ports = ["dt2-1.16", "dt2-1.17", "dn2-1.11", "dn2-1.12"]
requires = []
conflicts = []

[targets]
"dt2-1.16" = "experimental"
"dt2-1.17" = "experimental"
"dn2-1.11" = "experimental"
"dn2-1.12" = "experimental"

# The same machine as machines/pluck, loaded at run time (docs/findings/32-runtime-dsp-machines.md). `patchkit pack test/dyn-pluck
# --device dt2 -o ...dkm` lowers the typed sections below into the `register` records and links the DSP object into the `.dkm`
# DSP section; the digikit runtime sends the code to the DSP and publishes the voice row (type 18) and the machine row.
# The DSP object is built from the SAME source file as machines/pluck, so the routine that runs is the patched-in routine.
[[object]]
path = "build/dyn-pluck-dsp.dko.json"
sources = ["../../machines/pluck/src/dsp/pluck.s"]
place = "dsp.l2"
devices = ["dt2"]

# Digitone II: the routine on the voice hook's ABI (one buffer per voice slot), from the same source as machines/pluck's DN2 object.
[[object]]
path = "build/dyn-pluck-dn2-dsp.dko.json"
sources = ["../../machines/pluck/src/dsp/pluck_dn2.s"]
place = "dsp.l2"
devices = ["dn2"]

[[voice]]
machine = "pluck"
entry = "_pk_render"

[[machine]]
id = "pluck"
name = "Pluck"
short = "PLK"
clone_of = 0
knobs = [0xca, "pluck_decay", "pluck_pick", 0, "pluck_bright", "pluck_color", 0, 0xd1]

# Digitone II: a machine of its own type (own_dsp) with its own SYN page: DECAY, PICK, BRIGHT, COLOR on knobs A .. D.
[machine.dn2]
own_dsp = true
knobs = ["pluck_decay", "pluck_pick", "pluck_bright", "pluck_color"]

[[param]]
id = "pluck_decay"
name = "Decay"
short = "DECAY"
template = 0xd1
min = 0
max = 0x7f00
default = 0x4000

[param.dn2]
template = 0xd5

[[param]]
id = "pluck_pick"
name = "Pick position"
short = "PICK"
template = 0xd1
min = 0
max = 0x7f00
default = 0x2000

[param.dn2]
template = 0xd5

[[param]]
id = "pluck_bright"
name = "Brightness"
short = "BRIGHT"
template = 0xd1
min = 0
max = 0x7f00
default = 0x5000

[param.dn2]
template = 0xd5

[[param]]
id = "pluck_color"
name = "Excitation colour"
short = "COLOR"
template = 0xd1
min = 0
max = 0x7f00
default = 0x2800

[param.dn2]
template = 0xd5

[[page]]
id = "pluck_syn"
machine = "pluck"
name = "PLUCK"
title = "Pluck"
devices = ["dn2"]
