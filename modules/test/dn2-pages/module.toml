[module]
id = "test/dn2-pages"
version = "0.1.0"
name = "Own pages (test, Digitone II)"
category = "test"
status = "experimental"
summary = "Test machine for the Digitone II with its own parameter pages: its own page names, titles, ranges and defaults on two SYN pages, to prove core/machines and core/params page support"
ports = ["dn2-1.12"]
requires = ["core/machines", "core/params"]
conflicts = []

[targets]
"dn2-1.12" = "experimental"

# The machine: its own type (6, permanent: core/machines types.toml), listed before MIDI. `own_dsp`: the DSP is told the machine's own type, which the FM
# engine renders as nothing (a silent machine); `clone_of = 0` gives it FM TONE's permission and name hint.
[[entry]]
registry = "machines"
id = "pages"
name = "Pages"
short = "PGS"
clone_of = 0
position = 4
own_dsp = 1
devices = ["dn2"]

# Six parameters of the sound array (slots 25 .. 64 hold 16-bit words, the UI shows 0 .. 127 as 0 .. 0x7f00). The
# template row (A Env Decay) supplies the formatter and the value class.
[[entry]]
registry = "params"
id = "pg_alpha"
name = "Alpha Level"
short = "ALPH"
template = 0xd5
slot = 25
min = 0
max = 0x7f00
default = 0x2000
devices = ["dn2"]

[[entry]]
registry = "params"
id = "pg_beta"
name = "Beta Half"
short = "BETA"
template = 0xd5
slot = 26
min = 0
max = 0x3f00
default = 0x1000
devices = ["dn2"]

[[entry]]
registry = "params"
id = "pg_gamma"
name = "Gamma High"
short = "GAMA"
template = 0xd5
slot = 27
min = 0x100
max = 0x7f00
default = 0x7000
devices = ["dn2"]

[[entry]]
registry = "params"
id = "pg_delta"
name = "Delta Skip"
short = "DELT"
template = 0xd5
slot = 30
min = 0
max = 0x7f00
default = 0x4000
devices = ["dn2"]

[[entry]]
registry = "params"
id = "pg_eps"
name = "Epsilon Low"
short = "EPSL"
template = 0xd5
slot = 40
min = 0
max = 0x7f00
default = 0x0800
devices = ["dn2"]

[[entry]]
registry = "params"
id = "pg_zeta"
name = "Zeta Full"
short = "ZETA"
template = 0xd5
slot = 41
min = 0
max = 0x7f00
default = 0x7f00
devices = ["dn2"]

# page 1: knobs A .. D, E .. H empty, I (the level) is the stock track level
[[entry]]
registry = "pages"
id = "pg1"
machine = "machines.pages.index"
name = "PGA"
title = "Pages Test"
c0 = "params.pg_alpha.index"
c1 = "params.pg_beta.index"
c2 = "params.pg_gamma.index"
c3 = "params.pg_delta.index"
s0 = 25
s1 = 26
s2 = 27
s3 = 30
devices = ["dn2"]

# page 2: knobs A and B
[[entry]]
registry = "pages"
id = "pg2"
machine = "machines.pages.index"
name = "PGB"
title = "Pages Test"
c0 = "params.pg_eps.index"
c1 = "params.pg_zeta.index"
s0 = 40
s1 = 41
devices = ["dn2"]
