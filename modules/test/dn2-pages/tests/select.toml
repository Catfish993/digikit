# PAGES (test machine): the 5th entry of the machine list; its two SYN pages are its own (page names and titles, ALPH BETA
# GAMA DELT / EPSL ZETA); the SYN key cycles them and a knob changes the page.

[test]
name = "select_pages"
devices = ["dn2"]
quick = true

[[step]]
wait_ms = 1500
[[step]]
tap = ["FUNC", "SRC"]
[[step]]
wait_ms = 300
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "YES"
[[step]]
wait_ms = 300
[[step]]
tap = "YES"
[[step]]
wait_ms = 300
[[step]]
tap = "SYN"
[[step]]
wait_ms = 400
[[step]]
expect_frame = "page_a"
[[step]]
tap = "SYN"
[[step]]
wait_ms = 400
[[step]]
expect_frame = "page_b"
differs_from = "page_a"
[[step]]
tap = "SYN"
[[step]]
wait_ms = 400
[[step]]
expect_frame = "page_a_again"
[[step]]
turn = "ENC A"
by = 4
events = 30
[[step]]
wait_ms = 100
[[step]]
expect_frame = "knob_moved"
differs_from = "page_a_again"
[[step]]
expect_no_fault = true
