[module]
id = "test/dyn-params"
version = "0.1.0"
name = "DYN-PARAMS"
category = "test"
status = "experimental"
summary = "A run-time machine with eight parameters, one per knob, to check the parameter rows the registry writes."
dynamic = true
ports = ["dt2-1.16", "dt2-1.17"]
requires = []
conflicts = []

[targets]
"dt2-1.16" = "experimental"
"dt2-1.17" = "experimental"

# Test fixture (docs/design/digikit-registry.md): a clone of SAMPLE (type 0) whose eight knobs are eight parameters of its own,
# so that every slot's row formula is exercised.
[[machine]]
id = "dynp"
name = "DynP"
short = "DYP"
clone_of = 0
knobs = ["p0", "p1", "p2", "p3", "p4", "p5", "p6", "p7"]
devices = ["dt2"]

[[param]]
id = "p0"
name = "Param 0"
short = "P0"
template = 0xd1
min = 0
max = 32512
default = 4096
devices = ["dt2"]

[[param]]
id = "p1"
name = "Param 1"
short = "P1"
template = 0xd1
min = 1
max = 32256
default = 4369
devices = ["dt2"]

[[param]]
id = "p2"
name = "Param 2"
short = "P2"
template = 0xd1
min = 2
max = 32000
default = 4642
devices = ["dt2"]

[[param]]
id = "p3"
name = "Param 3"
short = "P3"
template = 0xd1
min = 3
max = 31744
default = 4915
devices = ["dt2"]

[[param]]
id = "p4"
name = "Param 4"
short = "P4"
template = 0xd1
min = 4
max = 31488
default = 5188
devices = ["dt2"]

[[param]]
id = "p5"
name = "Param 5"
short = "P5"
template = 0xd1
min = 5
