# SINE is the 5th entry of the machine list (before MIDI); YES commits type 7, which the DSP receives as it is; after a
# TRIG the audio mirror (SRAM 0x8000487c, first byte) holds 7, the TX frame sends type 7 (own_dsp) and the voice sounds.

[test]
name = "select_sine"
devices = ["dn2"]
quick = true

[[step]]
wait_ms = 1500
[[step]]
tap = ["FUNC", "SRC"]
[[step]]
wait_ms = 300
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "YES"
[[step]]
wait_ms = 300
[[step]]
tap = "YES"
[[step]]
wait_ms = 300
[[step]]
tap = "TRIG 1"
[[step]]
wait_ms = 500
[[step]]
expect_mem = { addr = 0x8000487c, mask = 0xff000000, eq = 0x7000000 }
[[step]]
expect_mem = { addr = 0x80005ef4, mask = 0xffff0000, eq = 0x70000 }
[[step]]
expect_pcm_db = { min = -60, max = -6 }
[[step]]
expect_no_fault = true
