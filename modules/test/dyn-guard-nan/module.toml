[module]
id = "test/dyn-guard-nan"
version = "0.1.0"
name = "NAN-D"
category = "test"
status = "experimental"
summary = "Test fixture: a run-time machine whose DSP routine outputs NaN while a voice is active, to see the runtime guard of core/dsp-voice."
dynamic = true
ports = ["dt2-1.16", "dt2-1.17"]
requires = []
conflicts = []

[targets]
"dt2-1.16" = "experimental"
"dt2-1.17" = "experimental"

# Like test/dyn-dsp-hang, with a routine that outputs NaN (src/dsp/nan.s). The other routines in src/dsp (loud.s, clean.s) are fixtures of the
# guard's rig tests (tests/patchkit/test_dsp_guard.py) and are not linked into this module. Emulator scenario: debug-guard. The machine
# is harmless on a device: the guard zeroes the block and, after 8 faults in a second, switches the machine off until the next start
# (docs/findings/51-pluck-tune-guard.md).
[[object]]
path = "build/dyn-guard-nan-dsp.dko.json"
sources = ["src/dsp/nan.s"]
place = "dsp.l2"
devices = ["dt2"]

[[voice]]
machine = "guardnan"
entry = "_gn_render"

[[machine]]
id = "guardnan"
name = "NaN fixture"
short = "NAN"
clone_of = 0
knobs = [0xca, 0, 0, 0, 0, 0, 0, 0xd1]
