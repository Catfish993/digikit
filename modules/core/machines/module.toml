[module]
id = "core/machines"
version = "0.1.0"
name = "Machine types"
category = "core"
status = "experimental"
summary = "Framework that adds machine types to the Digitakt II MAIN OS: relocates the machine tables, patches the dispatch bounds and raises the persistence immediate"
requires = []
conflicts = []

# Content modules list `core/machines` in `requires` and declare `[[machine]]` entries; this module has no objects of
# its own: patchkit (native/patchkit/src/machines.rs) generates the object and the patches from the declarations and
# the image (finding 02, "core.machines"). The sites below are the anchors it reads.
