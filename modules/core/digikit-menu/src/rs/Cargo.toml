[package]
name = "pk_digikit_menu"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
dkrt-sdk = { path = "../../../runtime/sdk" }
dkrt-fit = { path = "../../../runtime/fit" }
dkneeds = { path = "../../../../../packages/dkneeds" }
dkfw = { path = "../../../fw/rs" }

# This crate sits inside the repository's cargo workspace but is built on its own (tools/patchkit/pk_rust.py).
[workspace]

[profile.release]
opt-level = "s"
panic = "abort"
lto = false
codegen-units = 1
debug = false
