[module]
id = "core/digikit-menu"
version = "0.1.0"
name = "DIGIKIT menu"
category = "core"
type = "framework"
author = "digikit"
status = "experimental"
summary = "Adds SETTINGS > DIGIKIT with MODULES (the .dkm files of the +Drive module store) and ABOUT"
requires = ["core/runtime"]
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# The menu is built from the firmware's own menu classes (finding 28): a hook at the end of the SETTINGS item list
# rebuild calls dk_add_item, which adds a DIGIKIT item after SYSTEM. The views, the item builder, the view stack push,
# the string constructor and the block read are anchors; the Rust crate (src/rs) holds the logic and calls the runtime's
# exported functions (dkrt_selection_get, dkrt_selection_set, dkrt_restart, dkrt_boot_info, dkrt_status, dkrt_module) by symbol: the module requires core/runtime.
# The Rust object has no externs table: it calls the firmware through the generated crate `dkfw` (modules/core/fw, from devices/fw/),
# whose undefined symbols are the anchor names. The assembly shim object still maps its own symbols below.

[[object]]
path = "build/digikit-menu-rs.dko.json"
sources = ["src/rs/Cargo.toml"]
place = "cf.expansion"

[[object]]
path = "build/digikit-menu-cf.dko.json"
sources = ["src/cf/shim.s"]
place = "cf.expansion"

[object.externs]
_fw_sp = "cf.string.fn.shared_ptr.make"
_fw_popup_make = "cf.window.fn.popup_make"
_dk_tail = "hook.cf.menu.site.settings_list.tail.tail"

# Hook before the last step of the rebuild (the selection restore); the displaced instructions run in the tail.
[[op]]
op = "hook"
hook = "cf.menu.hook.settings_list.tail"
to = "dk_hook"

[[claim]]
resource = "cf.menu.site.settings_list.tail"
