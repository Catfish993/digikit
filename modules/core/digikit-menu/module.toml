[module]
id = "core/digikit-menu"
version = "0.1.0"
name = "DIGIKIT menu"
category = "core"
type = "framework"
author = "digikit"
status = "experimental"
summary = "Adds SETTINGS > DIGIKIT: ABOUT, HEALTH, MEMORY and MODULES (the .dkm files of the +Drive module store, with check marks, a side panel and APPLY & RESTART)"
requires = ["core/runtime", "core/ui"]
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# The menu is written in C on <dk/ui.h> (core/ui draws it with the firmware's own views) and calls the runtime's exported
# functions (dkrt_scan, dkrt_fit, dkrt_selection_get and _set, dkrt_restart, dkrt_boot_info, dkrt_status, dkrt_module, dkrt_fx, ...) by symbol:
# the module requires core/runtime and core/ui. The one firmware hook, at the end of the SETTINGS item list rebuild, calls dk_add_item,
# which adds the DIGIKIT row after SYSTEM (dk_ui_stock_row of core/ui). The object has no externs table for C: the assembly shim maps
# its own symbol below.

[[object]]
path = "build/digikit-menu.dko.json"
sources = ["src/menu.c", "src/shim.s"]
place = "cf.expansion"

[object.externs]
_dk_tail = "hook.cf.menu.site.settings_list.tail.tail"

# Hook before the last step of the rebuild (the selection restore); the displaced instructions run in the tail.
[[op]]
op = "hook"
hook = "cf.menu.hook.settings_list.tail"
to = "dk_hook"

[[claim]]
resource = "cf.menu.site.settings_list.tail"
