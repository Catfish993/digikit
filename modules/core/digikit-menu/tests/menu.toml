# SETTINGS > DIGIKIT: the entry is the ninth row of SETTINGS, opens; MODULES lists the store (the harness card has none:
# NO STORE); ABOUT shows the runtime; NO leaves. The entry and the main page are pinned as frames (hashes in
# tests/patchkit/smoke/goldens.json). MODULES and ABOUT are checked by the state the menu draws them from, not by pixels:
# ABOUT by the rows it keeps in DK_ABOUT, MODULES by the store state of its list (2 = no store, no rows).
[test]
name = "menu"
devices = ["dt2", "dn2"]
quick = true

[[step]]
tap = "NO"
[[step]]
wait_ms = 300
[[step]]
tap = "SETTINGS"
[[step]]
wait_ms = 400
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 150
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 150
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 150
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 150
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 150
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 150
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 150
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 150
[[step]]
expect_frame = "settings_digikit"
[[step]]
tap = "YES"
[[step]]
wait_ms = 500
[[step]]
expect_frame = "digikit"
[[step]]
tap = "YES"
[[step]]
wait_ms = 800
[[step]]
expect_mem = {symbol = "STORE", module = "core/digikit-menu", eq = 2}
[[step]]
expect_mem = {symbol = "NENT", module = "core/digikit-menu", eq = 0}
[[step]]
tap = "NO"
[[step]]
wait_ms = 400
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 300
[[step]]
tap = "YES"
[[step]]
wait_ms = 600
[[step]]
expect_text = {rows = "DK_ABOUT", count = "DK_ABOUT_N", stride = 24, has = ["RUNTIME {runtime}", "BOOT: 0 OF 0 OK"]}
[[step]]
tap = "NO"
[[step]]
wait_ms = 400
[[step]]
tap = "NO"
[[step]]
wait_ms = 400
[[step]]
expect_no_fault = true
