[module]
id = "core/fx"
version = "0.1.0"
name = "FX chain"
category = "core"
type = "framework"
author = "digikit"
status = "experimental"
summary = "Effects adapter of the SHARC engine: effects registered by other modules process the master block in a chain, before the USB pack and the DAC converter, or (Digitakt II, route send) run on a send bus of the 16 tracks and add to the FX return bus; an empty chain plays the stock audio"
ports = ["dt2-1.16", "dt2-1.17", "dn2-1.11", "dn2-1.12"]
requires = []
conflicts = []

# Test status per firmware; patchkit does not read it.
[targets]
"dt2-1.16" = "untested"
"dt2-1.17" = "experimental"
"dn2-1.11" = "untested"
"dn2-1.12" = "experimental"

# One DSP object for both devices: the hook is the first instruction of the post-master function (H1, docs/findings/53), the master block is the
# literal of the Q31 converter, and the displaced instruction runs in the hook's tail.
[[object]]
path = "build/fx-dsp.dko.json"
sources = ["src/dsp/fx.s"]
place = "dsp.l2"

[object.externs]
_fx_table = "fx.rows"
_fx_master = "dsp.master.float_buf"
_fx_back = "hook.dsp.fx.entry.tail"

# The send route (Digitakt II; docs/findings/62-fx-send-route.md): the hook is the first instruction of the master function, before the master reads the track
# buses' sums and the FX return bus. The object calls the adapter's routines (`_fx_enter`, `_fx_exec`, `_fx_leave`), so the guard exists once.
[[object]]
path = "build/fxsend-dsp.dko.json"
sources = ["src/dsp/fxsend.s"]
place = "dsp.l2"
devices = ["dt2"]

[object.externs]
_fx_table = "fx.rows"
_fxs_trackbus = "dsp.fx.trackbus"
_fxs_return = "dsp.fx.return"
_fxs_back = "hook.dsp.fx.send.tail"

# The Digitone II's send route (docs/findings/67-fx-routes-dn2.md): the same hook on its master function, the slot mix of fxsend.s (`FXS_SLOTS`).
[[object]]
path = "build/fxsend-dn2-dsp.dko.json"
sources = ["src/dsp/fxsend-dn2.s"]
place = "dsp.l2"
devices = ["dn2"]

[object.externs]
_fx_table = "fx.rows"
_fxs_slotbus = "dsp.fx.slotbus"
_fxs_slotmap = "dsp.fx.slotmap"
_fxs_fadetab = "dsp.fx.fadetab"
_fxs_return = "dsp.fx.return"
_fxs_back = "hook.dsp.fx.send.tail"

[[op]]
op = "hook"
cpu = "sharc"
anchor = "dsp.fx.entry"
offset = 0
to = "_fx_entry"
displaced = "run"

[[op]]
op = "hook"
cpu = "sharc"
anchor = "dsp.fx.send"
offset = 0
to = "_fxs_entry"
displaced = "run"
devices = ["dt2", "dn2"]

# Effect modules add rows with `[[entry]] registry = "fx"`:
#
#     [[entry]]
#     registry = "fx"
#     id = "gain"
#     pc = "_fg_process"        # the process routine's symbol in the module's DSP object
#     desc = "_fg_desc"         # its dk_fx_desc (sdk/dk_fx.h)
#     state = "_fg_state"       # its state block (state_bytes of the desc)
#
# The chain runs in module order. The scan ends at the zero row patchkit appends (terminator); at most DK_FX_MAX (4) effects
# (packages/patchkit/tests/sdkgen.rs checks this number against sdk/dk_fx.h).
[[registry]]
name = "fx"
first = "0"
max = 4
limit = "fx_slots"
region = "dsp.l2"
terminator = true

# A row is 24 words (the send route's words 18 to 22 are described below the list):
#   0 pc (0 ends the table, 0xffffffff is a free row that the adapter skips: core/dynfx), 1 desc, 2 state, 3 enabled (1: on), 4 to 11 the
#   parameter words p0 to p7 (DK_FX_MAX_PARAMS), 12 was (enabled in the last block), 13 mix (float, the dry/wet blend, default 1.0), 14 dis (1: switched off by its faults until the
#   next start), 15 the block of the fault window's start, 16 faults in the window, 17 faults since the start, 18 route, 19 to 22 the send amounts,
#   23 spare. The words from 12 on belong to the adapter. The registry's window 2 of core/dsp-link is this table (24 words a row).
#   Route (word 18): 0 the master chain (the default), 1 a send bus of the 16 tracks (the send hook of the Digitakt II, src/dsp/fxsend.s): the effect's input is
#   the sum over the tracks of gain * the track's bus, its wet output times MIX (word 13, the return level) is added to the FX return bus. Other values: the row
#   is run by neither hook. Send amounts (words 19 to 22): one byte for each track, track t in word 19 + t / 4, byte t % 4 (little endian), 0 to 127 (larger values
#   count as 127); the gain of a track is (byte / 127) squared, ramped over the block. The runtime writes route and amounts like the other words (window 2).
[[registry.field]]
name = "pc"
kind = "u32"
[[registry.field]]
name = "desc"
kind = "u32"
[[registry.field]]
name = "state"
kind = "u32"
[[registry.field]]
name = "enabled"
kind = "u32"
default = 1
[[registry.field]]
name = "p0"
kind = "u32"
default = 0
[[registry.field]]
name = "p1"
kind = "u32"
default = 0
[[registry.field]]
name = "p2"
kind = "u32"
default = 0
[[registry.field]]
name = "p3"
kind = "u32"
default = 0
[[registry.field]]
name = "p4"
kind = "u32"
default = 0
[[registry.field]]
name = "p5"
kind = "u32"
default = 0
[[registry.field]]
name = "p6"
kind = "u32"
default = 0
[[registry.field]]
name = "p7"
kind = "u32"
default = 0
[[registry.field]]
name = "was"
kind = "u32"
default = 0
[[registry.field]]
name = "mix"
kind = "u32"
default = 0x3f800000
[[registry.field]]
name = "dis"
kind = "u32"
default = 0
[[registry.field]]
name = "wstart"
kind = "u32"
default = 0
[[registry.field]]
name = "wcount"
kind = "u32"
default = 0
[[registry.field]]
name = "nfault"
kind = "u32"
default = 0
[[registry.field]]
name = "route"
kind = "u32"
default = 0
[[registry.field]]
name = "amt0"
kind = "u32"
default = 0
[[registry.field]]
name = "amt1"
kind = "u32"
default = 0
[[registry.field]]
name = "amt2"
kind = "u32"
default = 0
[[registry.field]]
name = "amt3"
kind = "u32"
default = 0
[[registry.field]]
name = "spare23"
kind = "u32"
default = 0

[[claim]]
resource = "dsp.fx.hook"

[[claim]]
resource = "dsp.fx.send_hook"
devices = ["dt2", "dn2"]

# The hook: the first instruction of a function that the block orchestrator calls once per block after the master mix and before the USB pack
# (48 bits, `I7 = MODIFY(I7, imm)`, one caller). The rules hold on the older versions: the DSP blobs of 1.16/1.17 and of 1.11/1.12 are byte-identical.
# The site decides what the emulator's AOT core loses (a patched code range bars the generated regions of that range; finding 55):
#   Digitakt II FUN_1c80f2 (called at 0x1c311f, a block copy of 25 words' range): x1.02 DSP CPU. The first choice, H1 (FUN_1c14e7 at 0x1c30a0,
#   range 334 words) cost x1.47.
#   Digitone II FUN_1c244d (H1, called at 0x1c307b, also packs the USB stream; range 3482 words with the block orchestrator): x3.09. No cheaper
#   site is between the master and the pack (the master function's own range of 1221 words costs x1.62 and its end is not a 48-bit site).
[[anchor_rule]]
name = "dsp.fx.entry"
devices = ["dt2"]
cpu = "sharc"
kind = "sharc_func"
reloc_hash = "7a928b18c09b0bf52532b537d848258a23ae185e83113d920b592fd6ad4569df"
offset = 0x0
len = 6
mark = "D"

[[anchor_rule]]
name = "dsp.fx.entry"
devices = ["dn2"]
cpu = "sharc"
kind = "sharc_func"
reloc_hash = "0655a833019771f60976478adc8625fad9fec2879dc1156c2fc50d621cea2974"
offset = 0x0
len = 6
mark = "D"

# The master float buffer: the literal `I3 = 0x25f180` (Digitakt II) or `0x268438` (Digitone II) of the Q31 converter.
[[anchor_rule]]
name = "dsp.master.float_buf"
cpu = "sharc"
kind = "sharc_literal"
reloc_hash = "83fba5710c2b395cbd54e3cd583b1e205915fa6d1905d7285c3535203e52d05b"
offset = 0xf
mark = "D"

# The send route's sites (Digitakt II FUN_1c207b, the master function; one reloc hash for all three, offsets in parcels from its entry, finding 62):
#   the hook, its first instruction (called at 0x1c3099; `I7 = modify(I7, -0x14)`, 48 bits);
#   the track bus base, the literal `I13 = 0x252df8` of the master's loop over the 16 tracks (0x100 bytes apart; at 0x1c20ea);
#   the FX return bus, the literal `I5 = 0x254778` where the master mixes it (at 0x1c21ab).
# The DSP blobs of 1.16 and 1.17 are byte-identical, so the rules hold on both. The Digitone II has the same stages (FUN_1c1f1e, finding 53), not wired yet.
[[anchor_rule]]
name = "dsp.fx.send"
devices = ["dt2"]
cpu = "sharc"
kind = "sharc_func"
reloc_hash = "cd922cc4821f7d3912560bd7e559ebe263957a4e55d8a784b0ce16bf06dd7454"
offset = 0x0
len = 6
mark = "D"

[[anchor_rule]]
name = "dsp.fx.trackbus"
devices = ["dt2"]
cpu = "sharc"
kind = "sharc_literal"
reloc_hash = "cd922cc4821f7d3912560bd7e559ebe263957a4e55d8a784b0ce16bf06dd7454"
offset = 0x6f
mark = "D"

[[anchor_rule]]
name = "dsp.fx.return"
devices = ["dt2"]
cpu = "sharc"
kind = "sharc_literal"
reloc_hash = "cd922cc4821f7d3912560bd7e559ebe263957a4e55d8a784b0ce16bf06dd7454"
offset = 0x130
mark = "D"

# The Digitone II's send route (FUN_1c1f1e, the master function; one reloc hash for all four, offsets in parcels from its entry, finding 67):
#   the hook, its first instruction (called at 0x1c305d; `I7 = modify(I7, -16)`, 48 bits);
#   the slot buses' base, the literal `I4 = 0x257ee8` of the loop that sums the 16 voice slots into the track buses (0x100 bytes a slot; at 0x1c1fa2);
#   the slot-to-track map, the literal `I2 = 0x257898` of the same loop (at 0x1c1f9f; 16 halfwords, slot v in half v % 2 of word v / 2);
#   the FX return bus, the literal `I2 = 0x25b868` where the master mixes it (at 0x1c20fa).
# The DSP blobs of 1.11 and 1.12 are byte-identical, so the rules hold on both.
[[anchor_rule]]
name = "dsp.fx.send"
devices = ["dn2"]
cpu = "sharc"
kind = "sharc_func"
reloc_hash = "f8858e9860e4b5ec810b5f452283c08e7b3121684a47434acd0f48b08a9f4296"
offset = 0x0
len = 6
mark = "D"

[[anchor_rule]]
name = "dsp.fx.slotbus"
devices = ["dn2"]
cpu = "sharc"
kind = "sharc_literal"
reloc_hash = "f8858e9860e4b5ec810b5f452283c08e7b3121684a47434acd0f48b08a9f4296"
offset = 0x84
mark = "D"

[[anchor_rule]]
name = "dsp.fx.slotmap"
devices = ["dn2"]
cpu = "sharc"
kind = "sharc_literal"
reloc_hash = "f8858e9860e4b5ec810b5f452283c08e7b3121684a47434acd0f48b08a9f4296"
offset = 0x81
mark = "D"

[[anchor_rule]]
name = "dsp.fx.fadetab"
devices = ["dn2"]
cpu = "sharc"
kind = "sharc_literal"
reloc_hash = "f8858e9860e4b5ec810b5f452283c08e7b3121684a47434acd0f48b08a9f4296"
offset = 0x7e
mark = "D"

[[anchor_rule]]
name = "dsp.fx.return"
devices = ["dn2"]
cpu = "sharc"
kind = "sharc_literal"
reloc_hash = "f8858e9860e4b5ec810b5f452283c08e7b3121684a47434acd0f48b08a9f4296"
offset = 0x1dc
mark = "D"
