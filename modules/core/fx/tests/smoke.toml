# Quick tests of core/fx: the master stays audible with an empty chain and with test/fx-gain (0.5) in it, nothing faults or halts.
# Steps: tools/patchkit/pk_harness.py. Bit-exact checks (the empty chain equals stock, the effect scales the DAC and USB rings) come with the fx emulator proof (P3d-1a step 6).
[test]
name = "audible"
devices = ["dt2"]
quick = true

[[step]]
tap = "TRIG 1"
[[step]]
wait_ms = 400
[[step]]
expect_pcm_db = { min = -60, max = -3 }
[[step]]
expect_no_fault = true
