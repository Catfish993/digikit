# `operator new` (the 32 MiB buddy allocator, finding 01), the same code on all four images: its first lines take the heap mutex
# (`pea mutex; lea lock,a2; jsr (a2)`), test the descriptor (`tst.l desc`) and later release the mutex (`lea unlock,a5`).
