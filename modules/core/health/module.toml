[module]
id = "core/health"
version = "0.1.0"
name = "Health"
category = "core"
type = "framework"
author = "digikit"
status = "experimental"
summary = "Measures CPU load (idle-loop counter), the DSP block time (the DSP's own cycle count in its reply) and the firmware heap, for the DIGIKIT HEALTH page (emulator only)"
requires = ["core/runtime"]
conflicts = []
ports = ["dt2-1.16", "dt2-1.17", "dn2-1.11", "dn2-1.12"]

[targets]
"dt2-1.16" = "experimental"
"dt2-1.17" = "experimental"
"dn2-1.11" = "experimental"
"dn2-1.12" = "experimental"

# Three measurements, no DSP patch (finding 41):
#
# - CPU: the boot thread ends in an empty loop after it has created every task (finding 36), so it runs only when no task is ready.
#   A hook replaces the thread's last call (the one that creates the main-OS task), makes that call itself and then counts in
#   `health_idle`, forever. The DSP block interrupt closes a window every 1500 blocks (one second) and keeps the iterations of it.
# - DSP: the DSP's block handler reads EMUCLK at its start and its end and stores the difference in the first word of the record it
#   sends back (SHARC+ core manual, "Emulation Cycle Counting"). The ColdFire has that word in its record copy; a hook at the entry of
#   the block interrupt handler reads it once per block (average and maximum of a window).
# - RAM: the firmware heap (a buddy allocator) is read on request, under the allocator's own mutex, by walking its free lists.

[[object]]
path = "build/health.dko.json"
sources = ["src/cf/health.c", "src/cf/tramp.s"]
place = "cf.expansion"

[object.externs]
health_create_main = "health.fw.create_main"
health_rec_lit = "health.rec_lit"
health_desc_lit = "health.heap.desc_lit"
health_mutex_lit = "health.heap.mutex_lit"
health_lock_lit = "health.heap.lock_lit"
health_unlock_lit = "health.heap.unlock_lit"
health_block_next = "hook.health.hook.block.tail"

# The last call of the boot thread (`jsr <create the main-OS task>`) is replaced by a jump to the idle hook. It does not return.
[[op]]
op = "hook"
cpu = "cf"
anchor = "health.hook.idle"
to = "health_idle_hook"
displaced = "drop"

[[claim]]
resource = "health.hook.idle"

# The entry of the block interrupt handler (`link.w a6,#-0xd8; movem.l ...`): the hook counts the block and reads the DSP's cycle
# count; the two displaced instructions run in the tail.
[[op]]
op = "hook"
cpu = "cf"
anchor = "health.hook.block"
to = "health_block_hook"

[[claim]]
resource = "health.hook.block"
