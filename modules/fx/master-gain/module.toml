[module]
id = "fx/master-gain"
version = "0.1.0"
name = "Master gain"
category = "fx"
status = "experimental"
summary = "Scales the master output by a set gain."
requires = []
conflicts = []

# Test status per firmware; patchkit does not read it.
[targets]
"dt2-1.16" = "untested"
"dt2-1.17" = "experimental"
"dn2-1.11" = "untested"
"dn2-1.12" = "experimental"

[[object]]
path = "build/master-gain.dko.json"
sources = ["src/dsp/master_gain.s"]
place = "dsp.l2"

[object.externs]
_fw_q31_convert = "dsp.master.q31_converter"
_fw_master_buf = "dsp.master.float_buf"

[[op]]
op = "retarget"
anchor = "dsp.master.q31_call"
to = "_mg_hook"

[[claim]]
resource = "dsp.master.hook"

# The block handler's one call of the Q31 converter, the converter's entry, and the master float buffer (the
# constant the converter loads into I3). The same relocation-insensitive function hashes match on DT2 and DN2.
[[anchor_rule]]
name = "dsp.master.q31_call"
cpu = "sharc"
kind = "sharc_func"
reloc_hash = "65c7ebdfe23c9a760bc6077a912e16c0474c182ee9849925cb0c10af0689f984"
offset = 0x15c
len = 6
mark = "D"

[[anchor_rule]]
name = "dsp.master.q31_converter"
cpu = "sharc"
kind = "sharc_func"
reloc_hash = "83fba5710c2b395cbd54e3cd583b1e205915fa6d1905d7285c3535203e52d05b"
offset = 0x0
len = 6
mark = "D"

[[anchor_rule]]
name = "dsp.master.float_buf"
cpu = "sharc"
kind = "sharc_literal"
reloc_hash = "83fba5710c2b395cbd54e3cd583b1e205915fa6d1905d7285c3535203e52d05b"
offset = 0xf
mark = "D"
