[module]
id = "test/dyn-fx-gain-b"
version = "0.1.0"
name = "FX gain B (run time)"
category = "test"
type = "fx"
author = "digikit"
status = "experimental"
summary = "Second test effect of the FX contract, loaded at run time on the Digitakt II: the same gain as test/dyn-fx-gain under another module id (so another effect ID) and with other defaults (GAIN 0.25, MIX 64), for the persistence scenario."
dynamic = true
ports = ["dt2-1.16", "dt2-1.17"]
requires = []
conflicts = []

[targets]
"dt2-1.16" = "untested"
"dt2-1.17" = "experimental"

# `patchkit pack test/dyn-fx-gain-b --device dt2 -o fx-gain-b.dkm` makes the .dkm. The digikit runtime sends the DSP object to the DSP and
# publishes a free effect row of core/dynfx for the effect (state reserved behind the image, p0 at its default).
[[object]]
path = "build/dyn-fx-gain-b-dsp.dko.json"
sources = ["src/dsp/dyn_fx_gain_b.s"]
place = "dsp.l2"
devices = ["dt2"]

# One effect: its process routine and `dk_fx_desc` (sdk/dk_fx.h), and its page in the FX view (docs/design/digikit-registry.md "Effect pages"): the tab GNB, the title,
# one knob GAIN on the first position (p0, 0 to 1.27: the shown value 0 .. 127 is the gain in percent, so the default 25 is 0.25) and the MIX knob, default 64.
[[fx]]
id = "gain"
process = "_dgb_process"
desc = "_dgb_desc"
tab = "GNB"
title = "TEST GAIN B"
mix = 64
devices = ["dt2"]

[[fx.knob]]
name = "Gain"
short = "GAIN"
min = 0.0
max = 1.27
default = 0.25
display = "percent"
position = 0
