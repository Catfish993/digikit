[module]
id = "test/dyn-params"
version = "0.1.0"
name = "DYN-PARAMS"
category = "test"
type = "machine"
author = "digikit"
status = "experimental"
summary = "A run-time machine with four parameters of different ranges, to check the parameter rows the registry writes."
dynamic = true
ports = ["dt2-1.17"]
requires = []
conflicts = []

[targets]
"dt2-1.17" = "experimental"

# Test fixture (docs/design/digikit-registry.md). The declaration is in src/module.c (DK_MACHINE, DK_PARAM). The DSP is test/sine's, read
# from its folder (a machine needs DSP routines).
[[object]]
path = "build/dyn-params-cf.dko.json"
sources = ["src/module.c"]
place = "cf.expansion"

[[object]]
path = "build/dyn-params-dsp.dko.json"
sources = ["../sine/src/dsp/sine.s"]
place = "dsp.l2"
