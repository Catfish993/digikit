[module]
id = "test/dyn-dn2"
version = "0.1.0"
name = "DYN-DN2"
category = "test"
type = "machine"
author = "digikit"
status = "experimental"
summary = "A Digitone II machine added at run time: its own SYN page with four knobs, data only (no DSP code)."
dynamic = true
ports = ["dn2-1.12"]
requires = []
conflicts = []

[targets]
"dn2-1.12" = "experimental"

# Test fixture (docs/design/digikit-registry.md, finding 33): a machine of its own type (the permanent number is
# modules/core/machines/types.toml, [dn2.dynamic] "test/dyn-dn2:dyn_pluck") with one parameter page, as digikit/pluck has
# on the Digitone II, but loaded from the card. `own_dsp`: the DSP is told the machine's own type, which the FM engine renders as
# nothing, so the machine is silent until a DSP routine for it is loaded (lane A of the plan, not this module).
# `patchkit pack test/dyn-dn2 --device dn2 -o FILE.dkm` lowers it into MACHINE, PARAM and PAGE records.
[[machine]]
id = "dyn_pluck"
name = "DynSyn"
short = "DSY"
clone_of = 0
own_dsp = true
knobs = ["dn_a", "dn_b", "dn_c", "dn_d"]
devices = ["dn2"]

[[param]]
id = "dn_a"
name = "Dyn Alpha"
short = "ALPH"
min = 0
max = 0x7f00
default = 0x2000
devices = ["dn2"]

[[param]]
id = "dn_b"
name = "Dyn Beta"
short = "BETA"
min = 0
max = 0x3f00
default = 0x1000
devices = ["dn2"]

[[param]]
id = "dn_c"
name = "Dyn Gamma"
short = "GAMA"
min = 0x100
max = 0x7f00
default = 0x7000
devices = ["dn2"]

[[param]]
id = "dn_d"
name = "Dyn Delta"
short = "DELT"
min = 0
max = 0x7f00
default = 0x4000
devices = ["dn2"]

[[page]]
id = "dyn_syn"
machine = "dyn_pluck"
name = "DYN"
title = "Dyn Synth"
devices = ["dn2"]
