[module]
id = "test/dyn-dn2"
version = "0.1.0"
name = "DYN-DN2"
category = "test"
type = "machine"
author = "digikit"
status = "experimental"
summary = "A Digitone II machine added at run time: its own SYN page with four knobs, with the DSP of test/sine."
dynamic = true
ports = ["dn2-1.12"]
requires = []
conflicts = []

[targets]
"dn2-1.12" = "experimental"

# Test fixture (docs/design/digikit-registry.md, finding 33): a machine of its own type (the permanent number is
# modules/core/machines/types.toml, [dn2.dynamic] "test/dyn-dn2:dyn_pluck") with one parameter page, as digikit/pluck has
# on the Digitone II, but loaded from the card. The declaration is in src/module.c (DK_MACHINE, DK_PARAM, DK_PAGE).
# `patchkit pack test/dyn-dn2 --device dn2 -o FILE.dkm` reads it into MACHINE, PARAM and PAGE records. The DSP is test/sine's, read from its folder.
[[object]]
path = "build/dyn-dn2-cf.dko.json"
sources = ["src/module.c"]
place = "cf.expansion"

[[object]]
path = "build/dyn-dn2-dsp.dko.json"
sources = ["../sine/src/dsp/sine.s"]
place = "dsp.l2"
