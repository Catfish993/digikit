[module]
id = "test/dyn-fx-gain"
version = "0.1.0"
name = "FX gain (run time)"
category = "test"
type = "fx"
author = "digikit"
status = "experimental"
summary = "Test effect of the FX contract, loaded at run time on the Digitakt II: scales the master block by its parameter p0, the GAIN knob of its FX page (0 to 1.27, default 0.5)."
dynamic = true
ports = ["dt2-1.17", "dn2-1.12"]
requires = []
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# `patchkit pack test/dyn-fx-gain --device dt2 -o fx-gain.dkm` makes the .dkm. The digikit runtime sends the DSP object to the DSP and
# publishes a free effect row of core/dynfx for the effect (state reserved behind the image, p0 at its default).
# The effect declaration (DK_FX in src/module.c). It holds only the .dk.desc record; patchkit pack reads it and leaves it out of the .dkm.
[[object]]
path = "build/dyn-fx-gain-cf.dko.json"
sources = ["src/module.c"]
place = "cf.expansion"

[[object]]
path = "build/dyn-fx-gain-dsp.dko.json"
sources = ["src/dsp/dyn_fx_gain.s"]
place = "dsp.l2"
devices = ["dt2", "dn2"]
