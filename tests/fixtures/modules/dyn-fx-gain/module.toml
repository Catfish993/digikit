[module]
id = "test/dyn-fx-gain"
version = "0.1.0"
name = "FX gain (run time)"
category = "test"
type = "fx"
author = "digikit"
status = "experimental"
summary = "Test effect of the FX contract, loaded at run time on the Digitakt II: scales the master block by its parameter p0, the GAIN knob of its FX page (0 to 1.27, default 0.5)."
dynamic = true
ports = ["dt2-1.16", "dt2-1.17"]
requires = []
conflicts = []

[targets]
"dt2-1.16" = "untested"
"dt2-1.17" = "experimental"

# `patchkit pack test/dyn-fx-gain --device dt2 -o fx-gain.dkm` makes the .dkm. The digikit runtime sends the DSP object to the DSP and
# publishes a free effect row of core/dynfx for the effect (state reserved behind the image, p0 at its default).
[[object]]
path = "build/dyn-fx-gain-dsp.dko.json"
sources = ["src/dsp/dyn_fx_gain.s"]
place = "dsp.l2"
devices = ["dt2"]

# One effect: its process routine and `dk_fx_desc` (sdk/dk_fx.h), and its page in the FX view (docs/design/digikit-registry.md "Effect pages"): the tab GAN, the title,
# one knob GAIN on the first position (p0, 0 to 1.27: the shown value 0 .. 127 is the gain in percent, so the default 50 is 0.5) and the MIX knob, default 127 (wet).
[[fx]]
id = "gain"
process = "_dg_process"
desc = "_dg_desc"
tab = "GAN"
title = "TEST GAIN"
mix = 127
devices = ["dt2"]

[[fx.knob]]
name = "Gain"
short = "GAIN"
min = 0.0
max = 1.27
default = 0.5
display = "percent"
position = 0
