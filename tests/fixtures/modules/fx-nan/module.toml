[module]
id = "test/fx-nan"
version = "0.1.0"
name = "FX NaN"
category = "test"
type = "fx"
author = "digikit"
status = "experimental"
summary = "Negative test effect of core/fx: writes a NaN into its output; the conformance suite must reject it."
ports = ["dt2-1.16", "dt2-1.17", "dn2-1.11", "dn2-1.12"]
requires = ["core/fx"]
conflicts = []

[targets]
"dt2-1.16" = "untested"
"dt2-1.17" = "experimental"
"dn2-1.11" = "untested"
"dn2-1.12" = "experimental"

[[object]]
path = "build/fx-nan-dsp.dko.json"
sources = ["src/dsp/fx_nan.s"]
place = "dsp.l2"

[[entry]]
registry = "fx"
id = "nan"
pc = "_fn_process"
desc = "_fn_desc"
state = "_fn_state"
