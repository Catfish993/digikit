[module]
id = "test/twin-xslice"
version = "0.1.0"
name = "TWIN-XSLICE"
category = "test"
type = "machine"
author = "digikit"
status = "experimental"
summary = "Test fixture: test/dyn-xslice patched in (a static twin), to compare a run-time machine with its patched-in form."
ports = ["dt2-1.16", "dt2-1.17"]
requires = ["core/machines", "core/params"]
conflicts = []

[targets]
"dt2-1.16" = "experimental"
"dt2-1.17" = "experimental"

# Static twin of test/dyn-xslice (same typed sections, patched in at build time): tests/digikit compares the rows.
[[machine]]
id = "xslice_d"
name = "XSlice-D"
short = "XSD"
clone_of = 6
knobs = [0xf8, 0xf9, 0xfa, 0xfb, 0xfc, 0xfd, "xsd_spare", 0xfe]
devices = ["dt2"]

[[param]]
id = "xsd_spare"
name = "Spare"
short = "SPARE"
template = 0xd1
min = 0
max = 0x7f00
default = 0x2000
devices = ["dt2"]
