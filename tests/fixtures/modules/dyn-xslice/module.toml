[module]
id = "test/dyn-xslice"
version = "0.1.0"
name = "XSLICE-D"
category = "test"
type = "machine"
author = "digikit"
status = "experimental"
summary = "A slice machine added at run time: XSLICE as a data-only module for the digikit runtime."
dynamic = true
ports = ["dt2-1.17"]
requires = []
conflicts = []

[targets]
"dt2-1.17" = "experimental"

# A run-time module (`dynamic = true`): never patched into an image. `patchkit pack test/dyn-xslice --device dt2 -o ...`
# lowers these sections into the `.dkm` `register` records (docs/design/digikit-registry.md); the digikit runtime writes
# them into the rows that core/dynreg reserved. Data only: it has no code, so it plays like MANUAL SLICE (clone_of = 6).
#
# The type number is permanent (modules/core/machines/types.toml, [dt2.dynamic] "test/dyn-xslice:xslice_d"). The knobs
# are XSLICE's (the nine descriptor ID fields of MANUAL SLICE, knob 2 the orphaned CFADE row 0xfa), except knob 6, which
# is a parameter of this module: it exercises the parameter records.
[[machine]]
id = "xslice_d"
type_hint = 16   # the number this machine had before sticky ids (finding 52)
name = "XSlice-D"
short = "XSD"
clone_of = 6
devices = ["dt2"]

# An explicit layout: the descriptor ids of the base machine's rows.
[machine.dt2]
knobs = [0xf8, 0xf9, 0xfa, 0xfb, 0xfc, 0xfd, "xsd_spare", 0xfe]

[[param]]
id = "xsd_spare"
name = "Spare"
short = "SPARE"
min = 0
max = 0x7f00
default = 0x2000
devices = ["dt2"]
