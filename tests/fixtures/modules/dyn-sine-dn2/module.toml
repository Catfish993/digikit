[module]
id = "test/dyn-sine-dn2"
version = "0.1.0"
name = "SINE-D (Digitone II)"
category = "test"
type = "machine"
author = "digikit"
status = "experimental"
summary = "test/dn2-sine's DSP routine as a run-time module: only a DSP object and a voice row, no machine record (the Digitone II registry has none yet)."
dynamic = true
ports = ["dn2-1.11", "dn2-1.12"]
requires = []
conflicts = []

[targets]
"dn2-1.11" = "experimental"
"dn2-1.12" = "experimental"

# The DSP half of a run-time machine on the Digitone II, proven without the ColdFire registry (docs/findings/32-runtime-dsp-machines.md):
# `patchkit pack test/dyn-sine-dn2 --device dn2 -o ...dkm` links the object into the `.dkm` DSP section; the digikit runtime sends it
# to the DSP and publishes the voice row (type 18). The machine type is forced in the DSP's frame copy (`DSP_FRAME_POKE`) by the
# proof, since no machine row selects it. The object is built from the SAME source as test/dn2-sine.
[[object]]
path = "build/dyn-sine-dn2-dsp.dko.json"
sources = ["../dn2-sine/src/dsp/sine_voice_dn2.s"]
place = "dsp.l2"
devices = ["dn2"]

[[dsp_voice]]
type = 18
entry = "_sv_render"
devices = ["dn2"]
