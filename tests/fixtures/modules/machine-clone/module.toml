[module]
id = "test/machine-clone"
version = "0.1.0"
name = "Machine clone (test)"
category = "test"
type = "machine"
author = "digikit"
status = "experimental"
summary = "A second MANUAL SLICE clone with its own name, to test that core/machines gives two modules their own types"
requires = ["core/machines"]
conflicts = []

[targets]
"dt2-1.16" = "experimental"
"dt2-1.17" = "experimental"

# An unmodified clone of MANUAL SLICE (the stock descriptor's ID fields).
[[entry]]
registry = "machines"
id = "xclone"
name = "XClone"
short = "XCL"
clone_of = 6
f0 = 0xf8
f1 = 0xf9
f2 = 0
f3 = 0xfb
f4 = 0xfc
f5 = 0xfd
f6 = 0
f7 = 0xfe
f8 = 0x0a
