[module]
id = "test/input-probe"
version = "0.1.0"
name = "Input probe"
category = "test"
type = "raw"
author = "digikit"
status = "experimental"
summary = "Test fixture: a module whose SysEx commands press keys and turn encoders through core/input (the proof of the input adapter)"
requires = []
