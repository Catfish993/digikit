[targets]
"dt2-1.16" = "experimental"
"dt2-1.17" = "experimental"
"dn2-1.11" = "experimental"
"dn2-1.12" = "experimental"

# C, built by pk_build. Loaded by the digikit runtime from the card store (`patchkit pack test/input-probe`, tools/device/dktransfer.py).
[[object]]
path = "build/input-probe.dko.json"
sources = ["src/c/input_probe.c"]
place = "cf.expansion"
