[module]
id = "test/twin-dn2"
version = "0.1.0"
name = "TWIN-DN2"
category = "test"
type = "machine"
author = "digikit"
status = "experimental"
summary = "Test fixture: test/dyn-dn2 patched in (a static twin), to compare a run-time machine with its patched-in form."
ports = ["dn2-1.12"]
requires = ["core/machines", "core/params"]
conflicts = []

[targets]
"dn2-1.12" = "experimental"

# Static twin of test/dyn-dn2 (the same declaration in src/module.c, patched in at build time): tests/digikit compares the rows.
# The DSP is test/sine's, read from its folder.
[[object]]
path = "build/twin-dn2-cf.dko.json"
sources = ["src/module.c"]
place = "cf.expansion"

[[object]]
path = "build/twin-dn2-dsp.dko.json"
sources = ["../sine/src/dsp/sine.s"]
place = "dsp.l2"
