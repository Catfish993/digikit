[module]
id = "test/c-demo"
version = "0.1.0"
name = "C module demo"
category = "test"
type = "raw"
author = "digikit"
status = "experimental"
summary = "Test fixture: a C module that needs 64-bit division, remainder, multiplication and shifts (ColdFire libgcc helpers)"
requires = []
conflicts = []

[targets]
"dt2-1.16" = "experimental"
"dt2-1.17" = "experimental"
"dn2-1.11" = "experimental"
"dn2-1.12" = "experimental"

# C, built by pk_build with the helpers a 32-bit ColdFire lacks (`__udivdi3`, `__divdi3`, `__moddi3`, `__muldi3`, `__ashldi3`,
# `__lshrdi3`, `__ashrdi3`) linked from the libgcc built for -mcpu=54418 (tools/patchkit/pk_toolchains.py libgcc-cf). The module
# is loaded by the digikit runtime (`patchkit pack test/c-demo`), like test/dyn-demo; `dynamic = true` is only for modules that register machines.
[[object]]
path = "build/c-demo.dko.json"
sources = ["src/c/c_demo.c"]
place = "cf.expansion"
