[module]
id = "test/xslice"
version = "0.1.0"
name = "XSLICE"
category = "test"
type = "machine"
author = "digikit"
status = "experimental"
summary = "A slice machine like MANUAL SLICE, with its own SRC page."
ports = ["dt2-1.17"]
requires = ["core/machines"]
conflicts = []

[targets]
"dt2-1.17" = "experimental"

# The machine's type number is permanent (modules/core/machines/types.toml, "test/xslice:xslice"); it is exported as `machines.xslice.index`.
# The knobs are the nine descriptor ID fields of MANUAL SLICE (f0..f7, f8 the level 0x0a), with the empty box on the
# SRC page (knob 2) set to 0xfa, SLICE's orphaned CFADE parameter row (finding 02, "XSLICE").
[[machine]]
id = "xslice"
name = "XSlice"
short = "XSL"
clone_of = 6
position = 7
knobs = [0xf8, 0xf9, 0xfa, 0xfb, 0xfc, 0xfd, 0, 0xfe]
devices = ["dt2"]
