# A project with run-time machines on tracks 1 and 2 (parameter values, a p-lock and a preset lock on step 1) is saved under set A, then
# loaded and saved under set B (the track-1 machine is absent): the project slot equals the first save but for the header stamp, and
# the sounds keep their types. The full tier (roundtrip-dt2-orders) adds a same-set reload and the other load order.
[scenario]
name = "roundtrip-dt2"
kind = "roundtrip"
devices = ["dt2"]
tier = "quick"

[roundtrip]
order = ["A", "B"]
types = ["digikit/pluck:pluck", "test/dyn-xslice:xslice_d"]   # read from the boot's assignment (D7)
lock_turn = 11
sound_lock_turn = 2

[roundtrip.sets]
A = ["digikit/pluck", "test/dyn-xslice"]
B = ["test/dyn-xslice"]
A2 = ["test/dyn-xslice", "digikit/pluck"]

[[roundtrip.machines]]
track = 1
machine = "digikit/pluck:pluck"
hint = 7

[[roundtrip.machines]]
track = 2
machine = "test/dyn-xslice:xslice_d"
hint = 8
