# Digitone II: a machine with its own SYN page (test/dyn-dn2) and a sound (test/sine), loaded at boot, against the patched-in twin of the first: the rows
# are equal; the sine has no twin, its note is pinned by the SHA-256 of its PCM from the onset.
[scenario]
name = "equiv-dn2-set"
kind = "equiv"
devices = ["dn2"]
tier = "quick"

[equiv]
modules = ["test/dyn-dn2", "test/sine"]
twin = "test/twin-dn2"
play = "sine"
hint_run = 6   # the run-time machines follow MIDI: test/dyn-dn2 is the first, test/sine the second
trig_frame = 7000
voices = 1
ignore_run_machines = ["Sine"]   # test/sine has no twin: its machine row, parameter and page are not compared
pcm_sha256 = "8741bbe9552b4b036724b6dcce37e3612cedcfa44fb4ab0d2f864eb818824804"   # onset 272, 24000 samples (DN2 1.12, note 60, 261.65 Hz); "record" prints the hash
