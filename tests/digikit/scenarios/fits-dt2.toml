# The MODULES page of SETTINGS > DIGIKIT tells before a selection whether a module will load (docs/plans/what-fits.md): each row shows the memory the
# module takes and `x` when it does not fit next to the ticked ones; selecting such a row ticks nothing and says which resource is short. A store of four
# synthetic modules (one small, two a little over half the DSP area each, one larger than the area), the rows read from DK_LOAD.
[scenario]
name = "fits-dt2"
kind = "debug"
devices = ["dt2"]
tier = "quick"

[debug]
part = "fits"
