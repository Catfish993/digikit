# SETTINGS > DIGIKIT > FX ROUTES and the manifest's route fields (DN2, docs/findings/65-fx-routes.md): the effect's default route and the routes it allows come from its manifest
# (`route`, `routes` of `[[fx]]`, carried in the effect record of the .dkm); the settings key `fx/route/<module id>` overrides the default when the effect allows it; the page lists the effects and
# switches the pending route (MASTER ONLY, SEND ONLY, NO SEND SLOT); APPLY & RESTART writes the key and restarts, and the route is in effect after it; the FX view lists the send effects first.
[scenario]
name = "fx-routes-dn2"
kind = "fxroutes"
devices = ["dn2"]
tier = "quick"

[fxroutes]
hint = 5            # the sine's position in the machine list on the Digitone II
trig_frame = 7000
