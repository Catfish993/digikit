# The bisect of finding 49 (docs/PATCHING.md "Rung C2"): the rung C flow with core/dsp-voice built with DV_BISECT_C2. For types of 7 or more the
# wrapper writes the breadcrumb inline and takes the stock path: no CALL, no RTS, no MODE1 write. The routine is never called; the breadcrumb
# counts a stage 3 pass for each of the two voices of the track in every block (the dispatch counter); the DSP keeps running.
[scenario]
name = "rung-c-bisect"
kind = "rungc"
devices = ["dt2"]
images = ["dt2-1.17"]
tier = "full"

[rungc]
variant = "core/dsp-voice"
defines = ["DV_BISECT_C2"]
