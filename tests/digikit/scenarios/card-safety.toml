# Card safety (docs/findings/46-digikit-debug.md): the runtime's one card-write function refuses writes outside the store range; a blank card works
# as before; foreign bytes in the range make the card read-only for the runtime (nothing written, no selection, no upload, ABOUT says so); a card with
# our store keeps working; an upload on a blank card claims the range first, so a cut upload leaves a card the next boot calls ours.
[scenario]
name = "card-safety"
kind = "card"
devices = ["dt2"]
tier = "quick"

[card]
