# Isolation (docs/plans/capacity-isolation.md): test/sine loaded first keeps its sound, its ranges and its DSP bytes when the full set of the
# capacity tests is loaded behind it and three modules are refused. Two coupled boots: sine alone, sine and the full set; the PCM of the note
# is equal from the onset, the DSP bytes read back from L2 equal the packed image, the MODULES record is the same.
[scenario]
name = "isolation-dt2"
kind = "debug"
devices = ["dt2"]
tier = "full"

[debug]
part = "isolation"
module = "test/sine"
machine = "sine"
hint = 7
