# core/input (docs/plans/remote-control.md): keys pressed and encoders turned through the adapter reach the firmware's decoders as the panel's do. On a free-running daemon,
# `test/input-probe` (SysEx 0x38 key, 0x39 turn, calling input_key and input_turn of core/input) is installed and loaded; a key, a turn and a turn back are made with
# the emulator's own input.button / input.turn and then through the probe, and the screens must match after each step.
[scenario]
name = "input-adapter"
kind = "live"
devices = ["dn2", "dt2"]
tier = "full"

[live]
part = "input"
modules = ["test/input-probe"]
key_a = 2
key_b = 1
encoder = 1
detents = 4
settle = 10

# the DN2 shows its start display for a while after the boot: wait until the main UI takes keys
[live.dn2]
settle_s = 45
