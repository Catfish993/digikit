# A card smaller than the store area (docs/plans/storage.md, step 7; the emulator's `small` card identity reports 0x3B0000 sectors, below the area
# of both devices): the runtime finds the area out of reach, so there is no store: the check logs state "too small" (an error event), nothing is
# read or written in the area, uploads, deletes and folders answer E_NOSTORE, CAPACITY says 0 KiB, and the boot goes on to the UI.
[scenario]
name = "card-small"
kind = "card"
devices = ["dt2", "dn2"]
tier = "quick"

[card]
part = "small"
