# A run-time effect on the send route of core/fx (DN2, docs/findings/67-fx-routes-dn2.md): the route and amount words of the chain's row are written with dsp.patch; no amount or an amount on a
# silent track leaves the PCM dry bit for bit, an amount on the playing track adds the effect's return with the stock sends' squared gain law, a chord (two notes of the track, so two voice
# slots) adds the sum of both slots, and the effect runs once a block (the master chain skips a send row).
[scenario]
name = "fx-send-dn2"
kind = "fxsend"
devices = ["dn2"]
tier = "quick"

[fxsend]
hint = 5            # the sine's position in the machine list on the Digitone II
trig_frame = 7000
