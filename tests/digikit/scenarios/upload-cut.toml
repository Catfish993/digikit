# A power cut after the Nth card write of an upload: during staging, after the table, between header B and header A, after A. The next
# boot reads a valid store (old or new, never mixed) and takes another upload.
[scenario]
name = "upload-cut"
kind = "upload"
devices = ["dt2", "dn2"]
tier = "full"

[upload]
part = "cut"
