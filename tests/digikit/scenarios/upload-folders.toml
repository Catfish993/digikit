# Store format 3 over USB (docs/design/digikit-upload.md, docs/design/digikit-store.md): folders, LIST by prefix and its paging, MKDIR, CAPACITY's STORE entry,
# a streamed upload of several MiB, a delete that frees its space for the next file (first fit), and the +Drive round trip. The card read back by plusdrive
# equals the files sent after every step.
[scenario]
name = "upload-folders"
kind = "upload"
devices = ["dt2", "dn2"]
tier = "full"

[upload]
part = "folders"
big_mib = 6
