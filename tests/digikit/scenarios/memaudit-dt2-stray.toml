# Negative control of the ColdFire memory audit: test/dyn-demo-stray stores one word 128 KiB above its counter, in the arena and outside its
# block, on its first slot call. The audit must report exactly that one store, written by that module's code, in the arena.
[scenario]
name = "memaudit-dt2-stray"
kind = "debug"
devices = ["dt2"]
tier = "quick"

[debug]
part = "memaudit"
modules = ["test/c-demo", "test/dyn-demo-stray"]
must_run = ["test/dyn-demo-stray"]

[[debug.expect]]
module = "test/dyn-demo-stray"
