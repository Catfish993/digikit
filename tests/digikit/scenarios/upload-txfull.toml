# A host that never reads its MIDI input: the firmware's TX ring is full. The reply is dropped, not sent into the ring (the firmware's TX
# function would spin in the MIDI task); stock messages are still routed.
[scenario]
name = "upload-txfull"
kind = "upload"
devices = ["dt2", "dn2"]
tier = "full"

[upload]
part = "txfull"
