# A selection loaded at boot plays like the same module patched in (DT2): rows, voice row, PCM of a note.
[scenario]
name = "equiv-dyn-pluck"
kind = "equiv"
devices = ["dt2", "dn2"]
tier = "quick"

[equiv]
modules = ["test/dyn-pluck"]
twin = "digikit/pluck"
play = "pluck"
static_type = 9
hint = 7
trig_frame = 3500   # the note starts shortly after the panel setup ends (frame 3330 in both rigs); the capture is as long as ever
voices = 1

# Digitone II: the same module (own_dsp machine, SYN page, DSP routine) against the patched-in digikit/pluck (type 9, listed before MIDI)
[equiv.dn2]
hint = 4
hint_run = 5    # the run-time machine follows MIDI
trig_frame = 7000
ref_plain = true   # digikit/pluck patched in leaves no room for the runtime's 320 KiB DSP area: the reference image has no runtime
