# Rung C with the core taking the kernel's interrupts between any two instructions of the wrapper (SHARC_IRQ_PROBE, finding 49 section 9): every
# instruction boundary from _dv_entry to the first helper gets a kernel tick (TMZHI) and a context-switch request (SFT3I) latched just before it.
# On silicon a nested interrupt can land there; the coupled model otherwise delivers the DSP's events only between runs of the core. The rung C
# checks apply except the PCM comparison (no patched-in twin: the injected interrupts change the timing).
[scenario]
name = "rung-c-irq"
kind = "rungc"
devices = ["dt2"]
images = ["dt2-1.17"]
tier = "full"

[rungc]
irq_probe = "both"
irq_every = 7
