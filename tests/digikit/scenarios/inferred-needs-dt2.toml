# Inferred needs (docs/design/digikit-dkm.md, "Needs are inferred from the contents"; docs/plans/what-fits.md): each module that packs for the device is loaded alone on a
# ColdFire-only rig, and what the runtime took of the arena, the DSP area and the rows equals what `dkneeds` infers from the module's contents (the module declares nothing). The
# fixtures that fault on purpose are left out.
[scenario]
name = "inferred-needs-dt2"
kind = "debug"
devices = ["dt2"]
tier = "quick"

[debug]
part = "inferred-needs"
static = ["core/input"]
exclude = ["test/dyn-crash", "test/dyn-fault", "test/dyn-fault-late"]
