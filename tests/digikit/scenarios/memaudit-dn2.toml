# The ColdFire memory audit on the Digitone II (see memaudit-dt2): c-demo, dyn-demo and a run-time machine with its own SYN page.
[scenario]
name = "memaudit-dn2"
kind = "debug"
devices = ["dn2"]
tier = "quick"

[debug]
part = "memaudit"
modules = ["test/c-demo", "test/dyn-demo", "test/dyn-dn2"]
must_run = ["test/dyn-demo"]

[[debug.machines]]
track = 1
machine = "test/dyn-dn2:dyn_pluck"
hint = 5