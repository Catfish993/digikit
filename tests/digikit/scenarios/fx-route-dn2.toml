# The send page of the track FX key (DN2, docs/findings/64-fx-send-page.md): the route of an effect is a setting; an effect on the send route has a knob on the second page of the FX key for
# the current track; the amount follows the knob (settings, DSP row, PCM), survives a kit load, is never saved in an Elektron file, and no p-lock or CC comes from the knob.
[scenario]
name = "fx-route-dn2"
kind = "fxroute"
devices = ["dn2"]
tier = "quick"

[fxroute]
hint = 5            # the sine's position in the machine list on the Digitone II
trig_frame = 7000
