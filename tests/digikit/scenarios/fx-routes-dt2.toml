# SETTINGS > DIGIKIT > MODULES > side panel > ROUTE... and the manifest's route fields (docs/findings/65-fx-routes.md): the effect's default route and the routes it allows come from its manifest
# (`route`, `routes` of the DK_FX record, carried in the effect record of the .dkm); the settings key `fx/route/<module id>` overrides the default when the effect allows it; the ROUTE... choice offers the allowed
# routes and the free send slots (MASTER only, SEND only, no send slot); NO and YES on APPLY & RESTART? write the key and restart, and the route is in effect after it; the FX view lists the send effects first.
[scenario]
name = "fx-routes-dt2"
kind = "fxroutes"
devices = ["dt2"]
tier = "quick"

[fxroutes]
hint = 7            # the sine's position in the machine list (the same as fx-route-dt2)
trig_frame = 7500
