# A sample sent into the `samples/` folder of the digikit store through the runtime's upload commands, by the generic samples API (apps/web/src/modules/samples.ts; the
# backend is the profile's `[storage] samples`, "digikit" on the Digitone II) and the wasm WAV converter (packages/dksample), on a free-running emulator (the desktop app's
# setup). The sample goes up in several chunks; VERIFY (the runtime hashes the stored file from a fresh card read) matches the host's sha256, a corrupted copy reports failed,
# a delete frees the space, and the store survives a RESTART. The card mirror holds the file the client sent (docs/plans/storage.md, step 5).
# Needs apps/web/public/dksample.wasm (`uv run python -m tools.emulator.native_wasm --patchkit-only`) and node.
[scenario]
name = "samples-store"
kind = "live"
devices = ["dn2"]
tier = "full"

[live]
part = "samples-store"
modules = []
settle_s = 12
