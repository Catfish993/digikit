# The values of a run-time effect are saved with the kit (DT2): Save Kit and Load Kit give the effect its values back, a kit without them or with another effect's gives the defaults.
[scenario]
name = "fx-persist-dt2"
kind = "fxpersist"
devices = ["dt2"]
tier = "quick"

[fxpersist]
hint = 7            # the sine's position in the machine list (the same as fx-pages-dt2)
trig_frame = 7500
