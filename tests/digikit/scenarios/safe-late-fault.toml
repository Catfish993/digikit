# A module that hangs the UI task some time into a session. The runtime clears its boot counter only after a stable period of UI loop
# (45,000 DSP blocks, 30 s; here shortened to 9,000 blocks, above the 6,000 blocks the coupled boot needs to be ready). A hang 8,000 blocks in (before the period is over) counts every boot as bad
# and the third boot is safe mode; a hang 10,000 blocks in (after it) clears the counter first and no boot is safe.
[scenario]
name = "safe-late-fault"
kind = "safe"
devices = ["dt2", "dn2"]
tier = "full"

[safe]
part = "late"
fault = "test/dyn-fault-late"
stable_blocks = 9000
early_blocks = 8000
late_blocks = 10000
