# Capacity of the runtime (docs/plans/capacity-isolation.md): every limit is filled with synthetic modules (`patchkit synth-dkm`, sets in
# tools/patchkit/pk_capacity.py computed from the device file) and the next module is refused with the limit's own code: the module table
# (SELECT refuses a ninth path, so E_TABLE_FULL is a defence), the staging buffer, the ColdFire arena, the DSP area, the voice rows, the
# machine types, the parameter rows and the page rows. ColdFire-only boots, one per case; no DSP needed for a refusal.
[scenario]
name = "capacity-dn2"
kind = "debug"
devices = ["dn2"]
tier = "quick"

[debug]
part = "capacity"
