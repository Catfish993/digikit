# fx-persist-dt2 with the user's own steps instead of the shortcuts (DT2): the stock kit is saved on a boot with no effect, a restart brings the effects, another restart swaps their rows.
# Two cold restarts make it about twice as long as fx-persist-dt2, so it belongs to the full tier.
[scenario]
name = "fx-persist-restart-dt2"
kind = "fxpersist"
devices = ["dt2"]
tier = "full"

[fxpersist]
hint = 7
restarts = true
