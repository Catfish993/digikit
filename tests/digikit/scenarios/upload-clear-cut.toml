# Two faults in a row (finding 43): a cut between header B and header A, then a torn header B on the next upload. The store must still read
# as the committed store, and take another upload: CLEAR cut after header B (the next upload stages over the old table), and an upload cut
# after header B.
[scenario]
name = "upload-clear-cut"
kind = "upload"
devices = ["dt2", "dn2"]
tier = "full"

[upload]
part = "clearcut"
