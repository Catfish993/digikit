# The same project through four boots: set A, set A again (control for the header stamp), set B (the track-1 machine is absent) and set A in
# the other load order. Every later save equals the second save byte for byte; all equal the first but for the header stamp.
[scenario]
name = "roundtrip-dt2-orders"
kind = "roundtrip"
devices = ["dt2"]
tier = "full"

[roundtrip]
order = ["A", "A", "B", "A2"]
types = [18, 16]
lock_turn = 11
sound_lock_turn = 2

[roundtrip.sets]
A = ["test/dyn-pluck", "test/dyn-xslice"]
B = ["test/dyn-xslice"]
A2 = ["test/dyn-xslice", "test/dyn-pluck"]

[[roundtrip.machines]]
track = 1
type = 18
hint = 10

[[roundtrip.machines]]
track = 2
type = 16
hint = 7
