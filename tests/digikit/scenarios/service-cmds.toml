# Service commands (docs/design/module-sdk.md, "Service commands"): a module registers SysEx commands with Api.register_cmds. `test/svc-echo` is
# installed on a free-running daemon and loaded by the runtime; its commands (an echo, a status of its own) answer over SysEx, the runtime refuses
# a range that is not reserved, taken or empty, and a command nobody registered is E_PROTO.
[scenario]
name = "service-cmds"
kind = "live"
devices = ["dn2", "dt2"]
tier = "quick"

[live]
part = "svc"
modules = ["test/svc-echo"]
