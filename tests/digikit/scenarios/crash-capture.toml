# CPU exception capture (docs/findings/46-digikit-debug.md). A module raises an exception some blocks into the session (an illegal instruction for the
# early crash, a division by zero for the late one); the firmware's default handler calls the runtime's hook, which records the fault in RAM that the
# (modelled) soft reset keeps and resets; the next boot logs the record. The stable period is shortened as in safe-late-fault. EARLY: the crash is
# before the period (the boot counter stays raised); LATE: after it (the counter was cleared, the crashed boot is counted bad at the next boot).
# The coupled cold boot is ready about 6,000 to 7,000 blocks after the first UI-loop pass (the module's clock starts at its first slot call, the first
# pass); the delays lie 2,500 blocks (1.7 s) or more above it, so a boot is read before the next crash.
[scenario]
name = "crash-capture"
kind = "crash"
devices = ["dt2"]
tier = "full"

[crash]
crash = "test/dyn-crash"
stable_blocks = 12000
early_blocks = 9500
early_mode = 0
late_blocks = 13500
late_mode = 1
