# A machine module and a DSP voice at once (DT2): pluck against its patched-in twin.
[scenario]
name = "equiv-mixed"
kind = "equiv"
devices = ["dt2"]
tier = "full"

[equiv]
modules = ["digikit/pluck"]
twin = "test/patched-pluck"
play = "pluck"
static_type = 9   # RECHECK: the twin-xslice is gone
hint = 7        # list position of the patched-in pluck  # RECHECK
trig_frame = 9500   # RECHECK: one machine to choose from now; the default may do
voices = 1
