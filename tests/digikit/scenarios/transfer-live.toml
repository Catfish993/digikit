# The desktop app's setup (docs/CONTROL.md, run.mode free): a coupled daemon free-running on a stock image with the runtime patched in
# (the DN2 with no card file, the DT2 on a card built from a folder), driven by `dktransfer install` in real time. The upload and the RESTART must survive the guest's soft reset (the
# controller lays the guest's card writes over a default blank card when the firmware was loaded without one) and MODULES lists the module.
[scenario]
name = "transfer-live"
kind = "live"
devices = ["dn2", "dt2"]
tier = "quick"

[live]
modules = ["digikit/pluck"]
# The module store is mirrored to a folder (--mirror-dir): the installed file appears there with the card's sha256, and a deleted one goes.
