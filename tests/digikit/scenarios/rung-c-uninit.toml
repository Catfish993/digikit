# Rung C again with the emulator's SHARC memory that nothing loaded or wrote reading as a non-zero pattern (SHARC_UNINIT, finding 49), the way
# the device's SRAM would hold whatever it powered up with. Same checks as rung-c; the pluck must still equal the patched-in pluck.
[scenario]
name = "rung-c-uninit"
kind = "rungc"
devices = ["dt2"]
images = ["dt2-1.17"]
tier = "full"

[rungc]
uninit = "5a17"
