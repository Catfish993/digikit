# Digitone II: a project with a run-time machine (own SYN page) on track 1, parameter values, a p-lock and a preset lock is saved under
# set A, loaded and saved again under the same set (control for the header stamp), under set B (the machine is absent, the voice routine
# stays) and under A in the other load order: the project slot is byte-identical to the first save but for the header stamp.
[scenario]
name = "roundtrip-dn2"
kind = "roundtrip"
devices = ["dn2"]
tier = "full"

[roundtrip]
order = ["A", "A", "B", "A2"]
types = ["test/dyn-dn2:dyn_pluck"]
lock_turn = 11
sound_lock_turn = 2

[roundtrip.sets]
A = ["test/dyn-dn2", "test/dyn-sine-dn2"]
B = ["test/dyn-sine-dn2"]
A2 = ["test/dyn-sine-dn2", "test/dyn-dn2"]

[[roundtrip.machines]]
track = 1
machine = "test/dyn-dn2:dyn_pluck"
hint = 5
