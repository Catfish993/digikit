# The panel-driven project round trip on the coupled daemon (ColdFire and DSP together), as a device runs it: the same project, the same
# sets and the same comparison as `roundtrip-dt2`, whose panel script runs on ColdFire-only daemons (about 4 times faster; the DSP plays no
# part in what the firmware saves). This one is the realistic check and stays in the full tier.
[scenario]
name = "roundtrip-dt2-coupled"
kind = "roundtrip"
devices = ["dt2"]
images = ["dt2-1.17"]
tier = "full"

[roundtrip]
engine = "coupled"
order = ["A", "B"]
types = ["digikit/pluck:pluck", "test/sine:sine"]   # read from the boot's assignment (D7)
lock_turn = 11
sound_lock_turn = 2   # RECHECK: sine has one parameter (level)

[roundtrip.sets]
A = ["digikit/pluck", "test/sine"]
B = ["test/sine"]
A2 = ["test/sine", "digikit/pluck"]

[[roundtrip.machines]]
track = 1
machine = "digikit/pluck:pluck"
hint = 7

[[roundtrip.machines]]
track = 2
machine = "test/sine:sine"
hint = 8   # RECHECK
