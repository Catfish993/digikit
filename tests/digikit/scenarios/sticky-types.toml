# Sticky machine type numbers (docs/design/module-sdk.md 11.5 D7): a run-time machine gets its type number at the boot load and keeps it while the card's
# map (the selection record's reserved bytes) holds its hash: the same number after a boot without its module, no number taken from an absent
# machine while a free one exists, the map survives a restart, and a full map drops the lowest entry of a machine that is not in the boot (logged).
[scenario]
name = "sticky-types"
kind = "debug"
devices = ["dt2"]
images = ["dt2-1.17"]
tier = "quick"

[debug]
part = "sticky"
