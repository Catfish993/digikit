# The FX view pages and knobs of run-time effects (DN2): stock pages unchanged with no effect loaded, a fourth page for test/dyn-fx-gain (tab, title, GAIN and MIX),
# the knobs change the PCM as declared, deselecting the effect and restarting brings the stock view and the dry PCM back.
[scenario]
name = "fx-pages-dn2"
kind = "fxpage"
devices = ["dn2"]
tier = "quick"

[fxpage]
hint = 5            # the sine's position in the machine list on the Digitone II
trig_frame = 7000
