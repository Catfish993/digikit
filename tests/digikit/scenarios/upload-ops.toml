# The upload commands on a ColdFire-only rig (docs/design/digikit-upload.md): INFO, LIST, put of several sizes, replace, DELETE, CLEAR,
# E_FULL, E_HASH, a DATA retry, bad offset, length, state, path and version. The card read back by plusdrive equals the files sent.
[scenario]
name = "upload-ops"
kind = "upload"
devices = ["dt2", "dn2"]
tier = "full"

[upload]
part = "ops"
