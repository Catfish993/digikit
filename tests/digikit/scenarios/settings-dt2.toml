# The settings store of the runtime (docs/design/digikit-store.md, "The settings record"; docs/findings/63-settings-store.md): a key put through the mailbox is written 2 s after the last
# change to the copy that is not current, and only there; a soft restart reads it back; SETTINGS and CAPACITY report it; `patchkit store dump` decodes the card the guest left; a blank card is
# claimed first; a torn newer copy leaves the older one.
[scenario]
name = "settings-dt2"
kind = "settings"
devices = ["dt2"]
tier = "quick"

[settings]
cf_only = false     # the 2 s are counted in DSP blocks of the firmware's counter: a coupled boot
