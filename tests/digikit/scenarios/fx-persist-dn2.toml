# The values of a run-time effect are saved with the kit (DN2): Save Kit and Load Kit give the effect its values back, a kit without them or with another effect's gives the defaults.
[scenario]
name = "fx-persist-dn2"
kind = "fxpersist"
devices = ["dn2"]
tier = "quick"

[fxpersist]
hint = 5            # the sine's position in the machine list on the Digitone II
trig_frame = 7000
