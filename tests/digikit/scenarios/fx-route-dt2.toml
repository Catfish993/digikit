# The send page of the track FX key (DT2, docs/findings/64-fx-send-page.md): the route of an effect is a setting; an effect on the send route has a knob on the second page of the FX key for
# the current track; the amount follows the knob (settings, DSP row, PCM), survives a kit load, is never saved in an Elektron file, and no p-lock or CC comes from the knob.
[scenario]
name = "fx-route-dt2"
kind = "fxroute"
devices = ["dt2"]
tier = "quick"

[fxroute]
hint = 7            # the sine's position in the machine list (the same as fx-dyn-dt2)
trig_frame = 7500
