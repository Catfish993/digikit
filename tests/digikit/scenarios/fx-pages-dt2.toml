# The FX view pages and knobs of run-time effects (DT2): stock pages unchanged with no effect loaded, a fourth page for test/dyn-fx-gain (tab, title, GAIN and MIX),
# the knobs change the PCM as declared, deselecting the effect and restarting brings the stock view and the dry PCM back.
[scenario]
name = "fx-pages-dt2"
kind = "fxpage"
devices = ["dt2"]
tier = "quick"

[fxpage]
hint = 7            # the sine's position in the machine list (the same as fx-dyn-dt2)
trig_frame = 7500
