# The ColdFire memory audit with every limit used (docs/plans/capacity-isolation.md): behind test/dyn-demo the full set of the capacity
# tests (tools/patchkit/pk_capacity.py full_set: all module records, every machine type, parameter and page row, every voice row, the DSP area
# to its last granule, the arena to its last byte) and three modules that do not fit (E_NOMEM, E_DSP_ROWS, E_DSP_NOSPACE). The guard must
# report no store outside the module blocks and the patch code, while the UI is driven and during the load.
[scenario]
name = "memaudit-dn2-full"
kind = "debug"
devices = ["dn2"]
tier = "quick"

[debug]
part = "memaudit"
modules = ["test/dyn-demo"]
full = true
must_run = ["test/dyn-demo"]
