[package]
name = "sharc-gen-2"
license.workspace = true
repository.workspace = true
version = "0.0.1"
edition = "2024"
publish = false
build = "../sharc-gen/build.rs"
description = "The second generated native SHARC+ core (SHARC_GEN_DIR_2): the sources of sharc-gen, so one binary can hold both devices' cores"

# The same sources as packages/emulator/sharc-gen. Without SHARC_GEN_DIR_2 this crate is empty apart
# from the runtime fallbacks, so a workspace build without the second core stays cheap.
[dependencies]
sharc-rt = { path = "../sharc-rt" }

[lib]
name = "sharc_gen_2"
path = "../sharc-gen/src/lib.rs"
crate-type = ["rlib"]
test = false
doctest = false
