[package]
name = "sharc-gen"
license.workspace = true
repository.workspace = true
version = "0.0.1"
edition = "2024"
publish = false
description = "The generated native SHARC+ core (SHARC_GEN_DIR), compiled once apart from the engine"

# Only the include!s of the files tools/sharc_dev/sharc_transpile.py and
# tools/sharc_dev/sharc_rsgen.py write, plus the glue that lets them say `crate::rt`,
# `crate::EXIT_NEXT` and so on. Without SHARC_GEN_DIR this crate is empty
# apart from the runtime fallbacks.
[dependencies]
sharc-rt = { path = "../sharc-rt" }

[lib]
name = "sharc_gen"
crate-type = ["rlib"]
# No tests and no doctests in this crate. Without these two lines `cargo test --workspace` compiled the
# whole generated core a second time as a test harness with no test in it (measured 723 s on a 16-core
# machine, 2026-10-19) and ran rustdoc over it.
test = false
doctest = false
