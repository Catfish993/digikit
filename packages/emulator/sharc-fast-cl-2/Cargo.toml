[package]
name = "sharc-fast-cl-2"
license.workspace = true
repository.workspace = true
version = "0.0.1"
edition = "2024"
publish = false
build = "../sharc-fast-cl/build.rs"
autoexamples = false
description = "The second instance of the Cranelift backend (sources of sharc-fast-cl), built on sharc-native-2"

[dependencies]
sharc-native = { path = "../sharc-2", package = "sharc-native-2" }
cranelift-codegen = "0.136"
cranelift-frontend = "0.136"
cranelift-jit = "0.136"
cranelift-module = "0.136"
cranelift-native = "0.136"

[lib]
name = "sharc_fast_cl_2"
path = "../sharc-fast-cl/src/lib.rs"
crate-type = ["rlib"]
test = false
doctest = false
