[package]
name = "machine"
license.workspace = true
repository.workspace = true
version = "0.0.1"
edition = "2024"
publish = false
description = "Pure board bus seam for the native emulator"

[features]
default = []
trace = ["periph/trace"]

[dependencies]
coldfire = { path = "../coldfire" }
periph = { path = "../periph", default-features = false }
emmc-card = { path = "../card" }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "machine"
crate-type = ["rlib"]
