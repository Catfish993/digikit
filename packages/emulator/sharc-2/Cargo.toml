[package]
name = "sharc-native-2"
license.workspace = true
repository.workspace = true
version = "0.0.1"
edition = "2024"
publish = false
build = "../sharc/build.rs"
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "The second instance of the DSP engine (sources of sharc-native), built on sharc-gen-2"

# The same sources as packages/emulator/sharc, linked to the second generated core, so one binary can
# run either device's DSP. It has no C ABI symbols (cfg sharc_second), no binaries and no tests.
[dependencies]
sharc-rt = { path = "../sharc-rt" }
sharc-stats = { path = "../sharc-stats" }
sharc-gen = { path = "../sharc-gen-2", package = "sharc-gen-2" }

[features]
region-profile = []
fast-dump = []

[lib]
name = "sharc_native_2"
path = "../sharc/src/lib.rs"
crate-type = ["rlib"]
test = false
doctest = false
