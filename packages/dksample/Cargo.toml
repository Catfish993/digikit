[package]
name = "dksample"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "WAV to native sample converter and +Drive content hash (shared by plusdrive-format and the wasm32 C ABI of apps/web/public/dksample.wasm)"

[lib]
name = "dksample"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

