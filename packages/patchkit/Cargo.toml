[package]
name = "patchkit"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Firmware modules for Digitakt II and Digitone II: port lockfiles, linker, patch apply, verify"

[lib]
name = "patchkit"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "patchkit"
path = "src/main.rs"

# The patch-time tool: no generated SHARC core, no toolchain. Builds in seconds and for wasm32.
[dependencies]
dt2-firmware-loader = { path = "../emulator/loader" }
coldfire = { path = "../emulator/coldfire" }
dkneeds = { path = "../dkneeds" }
dkupload = { path = "../dkupload" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9.12"
# `patchkit build`: reads the ELF objects of the ColdFire toolchain. Read-only, no_std features: builds for wasm32.
object = { version = "0.37", default-features = false, features = ["read_core", "elf"] }
# The settings record's decoder (the code the runtime uses); no_std, builds for every target.
dkrt-sdk = { path = "../../modules/core/runtime/sdk" }

# `patchkit store dump` reads card images: the binary only (not wasm32).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
plusdrive-format = { path = "../emulator/plusdrive" }
emmc-card = { path = "../emulator/card" }
