# The reset path (copy and clear helpers): ColdFire anchors.
# Moved from module manifests; names unchanged (step 3, docs/design/firmware-decls.md).

[[value]]
name = "cf.reset.clear_helper"
cpu = "cf"
rule = { kind = "cf_reset_helper", which = "clear" }
mark = "D"
users = ["core/expansion"]

[[value]]
name = "cf.reset.copy_helper"
cpu = "cf"
rule = { kind = "cf_reset_helper", which = "copy" }
mark = "D"
users = ["core/expansion"]

[[fn]]
name = "cf.reset.init_calls"
cpu = "cf"
rule = { kind = "cf_reset_init_calls" }
mark = "D"
users = ["core/expansion"]
