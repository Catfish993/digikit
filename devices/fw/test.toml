# test: anchors used only by test fixtures
# Names follow <cpu>.<subsystem>.<kind>.<name>; was = former names, for reading older docs, never resolved (docs/design/firmware-decls.md).

# Kit::vfunc_12 on DT2 1.16 and 1.17 (the first function of its hash by address)
[[fn]]
name = "cf.test.fn.kit_vfunc_12"
was = ["cf.test.fn.demo_kit_setter", "test.demo.kit_setter"]
cpu = "cf"
devices = ["dt2"]
rule = { kind = "cf_func", hash = "de5ffecfc0d23b984befde7b3cbb97be", ordinal = 0, offset = 0x0, len = 14 }
mark = "D"
users = ["test/registry-demo"]

[[hook]]
name = "cf.test.hook.kit_vfunc_12"
site = "cf.test.fn.kit_vfunc_12"
cpu = "cf"
mode = "before"
regs = { in = [], clobbers = ["ccr"] }
devices = ["dt2"]
mark = "D"
users = ["test/registry-demo"]
doc = "First two instructions of Kit::vfunc_12, a stock setter; the test fixture hook counts calls."
