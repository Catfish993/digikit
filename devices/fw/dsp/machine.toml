# machine: machine selection tables
# Names follow <cpu>.<subsystem>.<kind>.<name>; was = former names, for reading older docs, never resolved (docs/design/firmware-decls.md).

[[data]]
name = "dsp.machine.data.selector.table"
was = ["dsp.machine.data.selector", "dsp.machines.selector_data"]
cpu = "sharc"
devices = ["dt2"]
rule = { kind = "sharc_table", reloc_hash = "d2c02a587786f9ee328897985095c271ff1c5b65f289224e435968ea4b5d3f00", offset = 0x248, len = 28 }
mark = "D"
users = ["core/machines"]
doc = "the table the selector literal points to (data: copied by mf_selector); the literal's instruction is the anchor above"

[[value]]
name = "dsp.machine.value.selector.table_ref"
was = ["dsp.machine.value.selector_table", "dsp.machines.selector_table"]
cpu = "sharc"
devices = ["dt2"]
rule = { kind = "sharc_literal", reloc_hash = "d2c02a587786f9ee328897985095c271ff1c5b65f289224e435968ea4b5d3f00", offset = 0x248 }
mark = "D"
users = ["core/machines"]
doc = "DSP: the machine type -> selector table (`I3 = 0x2567c0`, then `S2 = DM(I3, M2)` with M2 the type from the frame, FUN_1c24e9; finding 06). The instruction loads the table address as a literal: the anchor's value is the table."
