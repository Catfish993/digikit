# input: key and encoder decoding
# Names follow <cpu>.<subsystem>.<kind>.<name>; was = former names, for reading older docs, never resolved (docs/design/firmware-decls.md).

# The encoder decoder `void f(u32 encoder0, int delta)`: it adds the delta to the encoder's pending count; a periodic tick flushes it, clamped to +-30
# every 4 ticks. DT2 1.17 0x4011e598, DN2 1.12 0x4011ff0c.
[[fn]]
name = "cf.input.fn.enc_decoder"
was = ["input.fw.enc_decoder"]
cpu = "cf"
rule = { kind = "cf_func", hash = "173900efe85a324d026b5b84e6c72999", offset = 0x0, len = 2 }
mark = "D"
users = ["core/input"]

# The button decoder `void f(u32 channel, u32 new_mask)`: it compares the channel's new mask with the previous one (a byte per channel in RAM), updates
# the previous one and queues the events (key down and up, chords, repeat). DT2 1.17 0x4011e318, DN2 1.12 0x4011fc8c: the same code, cfdb h_strict hash
# identical and unique on both images. The first `lea` of its body loads the address of the previous masks: its literal is at +0x10.
[[fn]]
name = "cf.input.fn.key_decoder"
was = ["input.fw.key_decoder"]
cpu = "cf"
rule = { kind = "cf_func", hash = "157be8bc0a941e9aa4c960f56894c227", offset = 0x0, len = 2 }
mark = "D"
users = ["core/input"]

[[site]]
name = "cf.input.site.key_decoder.prev_mask_lit"
was = ["cf.input.site.key_mask_lit", "input.fw.key_mask_lit"]
cpu = "cf"
rule = { kind = "cf_func", hash = "157be8bc0a941e9aa4c960f56894c227", offset = 0x10, len = 4 }
mark = "D"
users = ["core/input"]
