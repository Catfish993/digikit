[[fn]]
name = "cf.window.fn.confirm_ctor"
cpu = "cf"
sig = "void (u8 *this, const u32 *title, const u32 *text, const std_function *cb, u8 flag)"
rule = { kind = "cf_func", hash = "2946e3541ac17682297f52c056397b89", offset = 0x0, len = 4 }
mark = "D"
users = ["core/ui"]
doc = "`ConfirmWindow(this, title, text, cb, flag)`: `title` and `text` point at COW `std::string`s (each cut to 80 chars; an empty `text` gives one line), `cb` is a `std::function<void(bool)>` that the constructor clones into +0x5c, `flag` is stored at +0x6c (0: the TRIG keys 0x19 to 0x28 are swallowed). The key handler (0x401114f0) closes the window on press of key 10 (YES) and calls cb(true), on key 12 (NO) and calls cb(false); it sets +0x4c to 1 or 2, and every other key is handled (modal). Allocate 0x8c bytes as a make_shared block: 0x10 control block, then the object at +0x10; push with `cf.view.fn.view_controller_push(brain view manager, &sp, 0)` (as the stock call sites that use 0x4011c08a do) or with `cf.view.fn.view_push` on a view that is on the stack. The shared_ptr is {object, control block}; release your own count after the push (`cf.string.fn.shared_ptr.release`). core/ui does the first."

[[site]]
name = "cf.window.site.confirm_cb_vptr_lit"
cpu = "cf"
rule = { kind = "cf_ptr", hash = "15fe03a811fbded8c0bb04292059c0e4", offset = 0x4a, len = 4 }
mark = "D"
users = ["core/ui"]
doc = "The 4-byte vtable literal of the `_Sp_counted_ptr_inplace<ConfirmWindow>` control block (the immediate of `move.l #vptr,(a2)` in the stock call site 0x40084d02, \"CLEAR SONG?\"); the anchor is that vtable. A module that builds a ConfirmWindow stores this value in word 0 of its 0x10-byte control block (use count and weak count 1 at +4, +8, object pointer at +0xc)."

[[fn]]
name = "cf.window.fn.multichoice_ctor"
cpu = "cf"
sig = "void (u8 *this, const u32 *items_vector, const u32 *title, const std_function *cb, u8 vertical)"
rule = { kind = "cf_func", hash = "5bc8260b138a22a9ca43e729c072f871", offset = 0x0, len = 4 }
mark = "D"
users = ["core/ui"]
doc = "`MultiChoiceWindow(this, items, title, cb, vertical)`: `items` points at a vector of COW `std::string` (begin, end, capacity; copied), `title` at a `std::string` (split at line breaks into the title lines at +0x80), `cb` is a `std::function<void(int)>` cloned into +0x8c, `vertical` is stored at +0xac (nonzero: items stacked and UP 11 / DOWN 14 move the selection; 0: items side by side and LEFT 13 / RIGHT 15). The selection index is at +0x9c. The key handler (0x40116e44) calls cb(index) and closes on press of key 10 (YES) or 0x31, and closes without a callback on key 12 (NO). The window is 0x40 x 0x20 pixels before sizing. Allocate 0xe8 bytes as a make_shared block (0x10 control block, object at +0x10); push with `cf.view.fn.view_push`."

[[site]]
name = "cf.window.site.multichoice_cb_vptr_lit"
cpu = "cf"
rule = { kind = "cf_ptr", hash = "1c0abc995058d98e0883295990696adc", offset = 0xfa, len = 4 }
mark = "D"
users = ["core/ui"]
doc = "The 4-byte vtable literal of the `_Sp_counted_ptr_inplace<MultiChoiceWindow>` control block (the immediate of `move.l #vptr,(a2)` at 0x400aa04c in the stock call site 0x400a9f54, SELECT INTERFACE); the anchor is that vtable. This vtable differs from the ConfirmWindow one: each make_shared type has its own."

[[fn]]
name = "cf.window.fn.toast"
cpu = "cf"
sig = "void (u8 *ui_states, const char *fmt, ...)"
rule = { kind = "cf_func", hash = "9582a093a5d20214e23283925ebeb058", offset = 0x0, len = 4 }
mark = "D"
users = ["core/ui"]
doc = "Shows a short message on the main screen: if the byte at `UIStates+0x45` is 0, formats `fmt` with vsnprintf into 256 bytes, keeps up to 32 characters in the string at `UIStates+0x48`, sets the timeout at +0x4c and requests a redraw. The text shows for a short time and then goes away; no view is pushed."

[[fn]]
name = "cf.window.fn.toast_str"
cpu = "cf"
sig = "void (u8 *ui_states, const u32 *text)"
rule = { kind = "cf_func", hash = "2582c14513ec5b76de994813149203e5", offset = 0x0, len = 4 }
mark = "D"
users = ["core/ui"]
doc = "As `cf.window.fn.toast` for a ready `std::string` (pointer to the one-word COW string): keeps up to 32 characters, sets the timeout, requests a redraw; does nothing when `UIStates+0x45` is not 0."

