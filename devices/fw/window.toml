[[fn]]
name = "cf.window.fn.popup_make"
was = ["cf.menu.fn.popup_make"]
cpu = "cf"
rule = { kind = "cf_ptr", hash = "ec84bde0abe50c47c39ea02790968411", offset = 0x32, len = 4 }
