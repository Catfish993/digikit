# text: fonts and text drawing
# Names follow <cpu>.<subsystem>.<kind>.<name>; was = former names, for reading older docs, never resolved (docs/design/firmware-decls.md).

[[fn]]
name = "cf.text.fn.draw"
cpu = "cf"
sig = "i32 (u8 *bitmap, u8 *font, i32 x, i32 y, i32 maxw, const char *s)"
rule = { kind = "cf_func", hash = "ab5767d093f5c9fd084a3085898e2c93", offset = 0x0, len = 4 }
mark = "D"
users = ["core/ui"]
doc = "Draws the plain string `s` at x, y: a 36-byte wrapper of the text routine 0x40113a84 with flags 0. Returns the advance. `maxw` is the fifth argument of the wrapper; its exact meaning is not read."

[[fn]]
name = "cf.text.fn.draw_fmt"
cpu = "cf"
sig = "i32 (u8 *bitmap, u8 *font, i32 x, i32 y, u32 flags, const char *fmt, ...)"
rule = { kind = "cf_func", hash = "452a08cbf1cea66a807f9ceaeeda4aff", offset = 0x0, len = 4 }
mark = "D"
users = ["core/ui"]
doc = "Draws printf-formatted text (vsnprintf into 128 bytes) and returns the advance. `flags`: bit 0 proportional path, 1 centre, 2 right-align, 3 outline after, 4 clear box before (bits 3 and 4 = 0x18), 5 centre vertically, 6 bottom-align, 7 translate (finding 71 section 3)."

[[fn]]
name = "cf.text.fn.draw_box"
cpu = "cf"
sig = "i32 (u8 *bitmap, u8 *font, i32 x, i32 y, i32 align, i32 arg6, const char *prefix, const char *fmt, ...)"
rule = { kind = "cf_func", hash = "0427dd2957059338b926578b23d5b087", offset = 0x0, len = 4 }
mark = "D"
users = ["core/ui"]
doc = "Draws printf-formatted text in a cleared box next to `x`, `y`: `align` 0 left, 1 centre, 2 right of x; `prefix` is an optional C string (0 = none) measured with the text; a frame is cleared first with fill_rect. The meaning of `arg6` is not read; the signature is from the entry code only."
