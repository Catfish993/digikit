site = "cf.machine.fn.dispatch"
cpu = "cf"
mode = "before"
regs = { in = [], clobbers = ["d0", "ccr"] }   # type at 4(sp); d1 is written only on the rts path
devices = ["dt2", "dn2"]
mark = "D"
users = ["core/machines"]
doc = "Entry of the machine descriptor lookup (type at 4(sp), d0 and d1 free); the hook answers added types from the registry."

[[hook]]
name = "cf.machine.hook.list.entry"
