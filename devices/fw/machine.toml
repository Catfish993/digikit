# One site, two hook points: DT2 calls an absolute address (retargetable); DN2 calls through `jsr (A3)`, so the call and
# the store after it are replaced.
[[hook]]
name = "cf.machine.hook.list.copy_target"
site = "cf.machine.site.list.copy"
cpu = "cf"
mode = "retarget"
regs = { in = [], clobbers = ["d0", "d1", "a0", "a1", "ccr"] }   # C ABI callee copy(begin, end, dest); result d0 = end of the copy
devices = ["dt2"]
mark = "D"
users = ["core/dynreg"]
doc = "The copy at the end of the machine list getter: `jsr copy(begin, end, dest)` (absolute, 6 bytes); the target becomes a copy that leaves out unfilled reserved machine types."

[[hook]]
name = "cf.machine.hook.list.copy_call"
site = "cf.machine.site.list.copy"
cpu = "cf"
mode = "replace"
regs = { in = ["a2"], clobbers = ["d0", "d1", "a0", "a1", "ccr"] }   # the copy args are on the stack; continues at site+6
devices = ["dn2"]
mark = "D"
users = ["core/dynreg"]
doc = "The getter's `jsr (A3); move.l D0,(4,A2)` (6 bytes; a2 = the vector being returned); both are replaced by a routine that copies without unfilled reserved machine types."
