# storage: block device reads and writes, the boot record
# Names follow <cpu>.<subsystem>.<kind>.<name>; was = former names, for reading older docs, never resolved (docs/design/firmware-decls.md).

[[fn]]
name = "cf.storage.fn.block.read"
was = ["cf.menu.fn.blk_read", "cf.storage.fn.block_read", "dkrt.fw.block_read"]
cpu = "cf"
sig = "i32 (u32 sector, u32 bytes, u8 *buf)"
rule = { kind = "cf_func", hash = "dcf1d4873d4a4fb5ac903e8ada9c1a12", offset = 0x0, len = 4 }
mark = "D"
users = ["core/digikit-menu", "core/runtime"]
doc = "The firmware's eMMC block read: int f(u32 sector, u32 bytes, void *buf), 0 = ok (finding 23 S6)."

[[fn]]
name = "cf.storage.fn.block.write"
was = ["cf.storage.fn.block_write", "dkrt.fw.block_write"]
cpu = "cf"
sig = "i32 (u32 sector, u32 bytes, const u8 *buf)"
rule = { kind = "cf_func", hash = "0dd5a176b94c6e30225068661b58a898", offset = 0x0, len = 2 }
mark = "D"
users = ["core/runtime"]
doc = "The firmware's eMMC block write: int f(u32 sector, u32 bytes, const void *buf), 0 = ok; it takes the ESDHC mutex itself (DT2 1.16 FUN_4012e0c0, DN2 1.11 FUN_4012c780). The runtime writes only the two sectors of the selection record with it."

# The firmware's normal writer of the boot record (finding 36 section 2; DT2 1.16 FUN_400f044a, 1.17 0x400f05ae; DN2 1.11 FUN_400f1e26,
# 1.12 FUN_400f1f8a): writes the arena to the next of the two record slots, invalidates the other, one shot per boot. The arena size
# and addresses differ per device, so the hash does.
[[fn]]
name = "cf.storage.fn.boot_record_write"
was = ["dkrt.fw.boot_record_write"]
cpu = "cf"
sig = "void ()"
rule.dt2 = { kind = "cf_func", hash = "ce2fecf00cf4757d0252acc24f11436c", offset = 0x0, len = 2 }
rule.dn2 = { kind = "cf_func", hash = "f2ab3c0214b6212848a6300a70dd6129", offset = 0x0, len = 2 }
mark = "D"
users = ["core/runtime"]
doc = "The firmware's normal writer of the boot record (finding 36 section 2; DT2 1.16 FUN_400f044a, 1.17 0x400f05ae; DN2 1.11 FUN_400f1e26, 1.12 FUN_400f1f8a): writes the arena to the next of the two record slots, invalidates the other, one shot per boot."
