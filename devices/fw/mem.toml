# mem: heap, operator new and free
# Names follow <cpu>.<subsystem>.<kind>.<name>; aliases are the old names until step 5 (docs/design/firmware-decls.md).

[[fn]]
name = "cf.mem.fn.free"
aliases = ["dkrt.fw.free"]
cpu = "cf"
rule = { kind = "cf_func", hash = "b591a5e50d0db4780b36812232691efa", offset = 0x0, len = 2 }
mark = "D"
users = ["core/runtime"]

# operator new and its free (the 32 MiB buddy allocator, finding 01): void *f(u32), void f(void *)
[[fn]]
name = "cf.mem.fn.new"
aliases = ["cf.menu.fn.new", "dkrt.fw.alloc"]
cpu = "cf"
sig = "u8 *(u32 size)"
rule = { kind = "cf_func", hash = "0dcb1d56c454607ae1698e4eeff299e7", offset = 0x0, len = 4 }
mark = "D"
users = ["core/digikit-menu", "core/runtime"]

