# mem: heap, operator new and free
# Names follow <cpu>.<subsystem>.<kind>.<name>; was = former names, for reading older docs, never resolved (docs/design/firmware-decls.md).

[[fn]]
name = "cf.mem.fn.free"
was = ["dkrt.fw.free"]
cpu = "cf"
sig = "void (u8 *p)"
rule = { kind = "cf_func", hash = "b591a5e50d0db4780b36812232691efa", offset = 0x0, len = 2 }
mark = "D"
users = ["core/runtime"]
doc = "The firmware's free, `void f(u8 *p)`, paired with operator new (32 MiB buddy allocator). core/runtime registers it as fw_free."

[[fn]]
name = "cf.mem.fn.new"
was = ["cf.menu.fn.new", "dkrt.fw.alloc"]
cpu = "cf"
sig = "u8 *(u32 size)"
rule = { kind = "cf_func", hash = "0dcb1d56c454607ae1698e4eeff299e7", offset = 0x0, len = 4 }
mark = "D"
users = ["core/digikit-menu", "core/runtime"]
doc = "operator new and its free (the 32 MiB buddy allocator, finding 01): void *f(u32), void f(void *)"

[[site]]
name = "cf.mem.site.heap.desc_lit"
was = ["cf.mem.site.heap_desc_lit", "health.heap.desc_lit"]
cpu = "cf"
rule = { kind = "cf_func", hash = "0dcb1d56c454607ae1698e4eeff299e7", offset = 0x1e, len = 4 }
mark = "D"
users = ["core/health"]
doc = "The 4-byte literal at +0x1e of operator new (`tst.l desc`): the address of the heap allocator descriptor. core/health walks it for heap statistics."

[[site]]
name = "cf.mem.site.heap.lock_lit"
was = ["cf.mem.site.heap_lock_lit", "health.heap.lock_lit"]
cpu = "cf"
rule = { kind = "cf_func", hash = "0dcb1d56c454607ae1698e4eeff299e7", offset = 0x14, len = 4 }
mark = "D"
users = ["core/health"]
doc = "The 4-byte literal at +0x14 of operator new (`lea lock,a2`): the address of the firmware's mutex lock function. core/health calls it to take the heap mutex."

[[site]]
name = "cf.mem.site.heap.mutex_lit"
was = ["cf.mem.site.heap_mutex_lit", "health.heap.mutex_lit"]
cpu = "cf"
rule = { kind = "cf_func", hash = "0dcb1d56c454607ae1698e4eeff299e7", offset = 0xe, len = 4 }
mark = "D"
users = ["core/health"]
doc = "`operator new` (the 32 MiB buddy allocator, finding 01), the same code on all four images: its first lines take the heap mutex (`pea mutex; lea lock,a2; jsr (a2)`), test the descriptor (`tst.l desc`) and later release the mutex (`lea unlock,a5`)."

[[site]]
name = "cf.mem.site.heap.unlock_lit"
was = ["cf.mem.site.heap_unlock_lit", "health.heap.unlock_lit"]
cpu = "cf"
rule = { kind = "cf_func", hash = "0dcb1d56c454607ae1698e4eeff299e7", offset = 0x92, len = 4 }
mark = "D"
users = ["core/health"]
doc = "The 4-byte literal at +0x92 of operator new (`lea unlock,a5`): the address of the firmware's mutex unlock function. core/health calls it to release the heap mutex."
