# Menu check marks (multi-select). Menu fields: checked vector<int> at +0x28 (begin), +0x2c (end), +0x30 (capacity), multi byte at +0x34.
# Menu vtable slots (4 bytes each from the vtable start): 5 clear items, 20 clear checks, 21 check, 22 uncheck, 23 checked-list getter (0x401155cc, returns a pointer to the list; the RIGHT key reads the first entry through it),
# 24 checked count, 25 is checked, 26 toggle, 27 multi getter (0x40114d2a), 28 enable multi, 29 disable multi (0x40114d40), 30 select all.
[[fn]]
name = "cf.menu.fn.clear_items"
cpu = "cf"
sig = "void (u8 *menu)"
rule = { kind = "cf_func", hash = "6ecedddcc16e20ae4fcf58da030d33d2", offset = 0x0, len = 4 }
mark = "D"
users = ["core/ui"]
doc = "Menu vtable slot 5: destroys the items (the vector at +4/+8, the shared_ptr count is dropped), sets the end to the begin and clears the words at +0x10, +0x14 and +0x18 (selected row, scroll, cursor: 0, not -1). It does not clear the check list; call `clear_checks` first."

[[fn]]
name = "cf.menu.fn.clear_checks"
cpu = "cf"
sig = "void (u8 *menu)"
rule = { kind = "cf_func", hash = "fa38c30445fdcf7a8414e816146e4535", offset = 0x0, len = 4 }
mark = "D"
users = ["core/ui"]
doc = "Menu vtable slot 20: when multi-select is on (slot 27), empties the check list (end = begin)."

[[fn]]
name = "cf.menu.fn.check"
cpu = "cf"
sig = "void (u8 *menu, i32 index)"
rule = { kind = "cf_func", hash = "f4125bd5404d8bb39400f3c5053a8352", offset = 0x0, len = 4 }
mark = "D"
users = ["core/ui"]
doc = "Menu vtable slot 21: appends `index` to the check list (a vector push_back). It does not test the multi flag and does not look for a duplicate; use `is_checked` first or `toggle_check`."

[[fn]]
name = "cf.menu.fn.uncheck"
cpu = "cf"
sig = "void (u8 *menu, i32 index)"
rule = { kind = "cf_func", hash = "01158de7d61c75819d633360065a741f", offset = 0x0, len = 4 }
mark = "D"
users = ["core/ui"]
doc = "Menu vtable slot 22: removes the first entry equal to `index` from the check list; does nothing when it is not there."

[[fn]]
name = "cf.menu.fn.checked_count"
cpu = "cf"
sig = "i32 (u8 *menu)"
rule = { kind = "cf_func", hash = "3b1a4fee8c6380fe14f3ca88e11f2085", offset = 0x0, len = 4 }
mark = "D"
users = ["core/ui"]
doc = "Menu vtable slot 24: the number of entries in the check list ((end - begin) / 4)."

[[fn]]
name = "cf.menu.fn.is_checked"
cpu = "cf"
sig = "u8 (u8 *menu, i32 index)"
rule = { kind = "cf_func", hash = "733d73411ac1ad4f3ce326816386ae8a", offset = 0x0, len = 4 }
mark = "D"
users = ["core/ui"]
doc = "Menu vtable slot 25: 1 when `index` is in the check list, else 0 (D0 is the 0 or 1 value; use the low byte)."

[[fn]]
name = "cf.menu.fn.toggle_check"
cpu = "cf"
sig = "void (u8 *menu, i32 index)"
rule = { kind = "cf_func", hash = "31353597da680e140c2b511825b20b47", offset = 0x0, len = 4 }
mark = "D"
users = ["core/ui"]
doc = "Menu vtable slot 26: calls `check` through slot 21 when `is_checked` (slot 25) says no, else `uncheck` through slot 22. A subclass that overrides those slots changes this."

[[fn]]
name = "cf.menu.fn.enable_multi"
cpu = "cf"
sig = "void (u8 *menu)"
rule = { kind = "cf_func", hash = "294017c03be86ef11b6dd7a92cef9cb8", offset = 0x0, len = 4 }
mark = "D"
users = ["core/ui"]
doc = "Menu vtable slot 28: sets the multi-select byte at +0x34 to 1. The popout view constructor calls it, so its three lists are multi-select from the start. A multi-select list draws a check glyph for each checked row (see finding 71 section 8)."

[[fn]]
name = "cf.menu.fn.select_all"
cpu = "cf"
sig = "void (u8 *menu)"
rule = { kind = "cf_func", hash = "2c0093e6273f166cad7eb8f51ed1ab1f", offset = 0x0, len = 4 }
mark = "D"
users = ["core/ui"]
doc = "Menu vtable slot 30: when multi-select is on, empties the check list, reserves room for the item count (slot 3) and calls `check` (slot 21) for every row index."

# Vtables: the anchor is slot 0 (the address the constructor stores in the object, vtable + 8); the hash covers the whole slot array.
[[data]]
name = "cf.menu.data.compact_vtable"
cpu = "cf"
rule = { kind = "cf_ptr", hash = "b08b31e64fd76741695b57ad98eda1c8", offset = 0x68, len = 156 }
mark = "D"
users = ["core/ui"]
doc = "The CompactVerticalMenuView vtable, slot 0 at the stored address (DT2 0x4021cbf0, DN2 0x402065bc), 39 slots (0 to 38) of 4 bytes. Slots 31 paint, 32 key, 33 encoder, 34 to 37 LED/activate hooks, 38 close hook; Menu slots 0 to 30 (see the check-mark entries). The other View sub-object vtables (offset -0x38) are not part of this array."

[[data]]
name = "cf.menu.data.popout_vtable"
cpu = "cf"
rule = { kind = "cf_ptr", hash = "7b05806dd7e5edea90febde36ceab5f5", offset = 0x58, len = 172 }
mark = "D"
users = ["core/ui"]
doc = "The MenuWithPopoutSideBarsView vtable, slot 0 at the stored address (DT2 0x4021d1b0, DN2 0x40206b7c), 43 slots (0 to 42) of 4 bytes. It copies slots 0 to 38 of the CompactVerticalMenuView table, overrides 31 paint, 32 key, 33 encoder, 38, and adds 39 main-list paint hook, 40 rebuild (empty stub 0x401d181a), 41 populate the right panel (empty stub 0x401d181c), 42 left-panel hook (DT2 0x401ba394). A subclass copies the table and overrides 39, 41 and 42."

