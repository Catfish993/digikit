rule = { kind = "cf_func", hash = "8db782f6fd735f89d3b7c856316c0b90", offset = 0x382, len = 6 }
mark = "D"
users = ["core/digikit-menu"]

[[site]]
name = "cf.menu.site.settings_list.tail"
was = ["cf.menu.settings_tail", "cf.menu.site.settings_tail"]
cpu = "cf"
rule = { kind = "cf_func", hash = "8db782f6fd735f89d3b7c856316c0b90", offset = 0x3a8, len = 8 }
mark = "D"
users = ["core/digikit-menu"]

# MenuItem, 0x54 bytes (finding 71 section 4, "MenuItem"). The draw function is a `std::function`; stock items put a bitmap blit there, and
# core/digikit-menu empties it (manager at +0x34, invoker at +0x38) for a row without a glyph.
[[struct]]
name = "cf.menu.struct.MenuItem"
size = 0x54
fields = [
  { name = "draw", off = 0x2c, type = "std_function" },
]
mark = "D"
users = ["core/digikit-menu"]

# VerticalMenuView, 0x1ac bytes (finding 71 section 4, "VerticalMenuView"): the Menu base is at +0, the View sub-object at +0x38. `cursor` is
# the Menu's cursor row in the window (Menu +0x18, read by core/digikit-menu); `icon` is the icon pointer the ctor stores (+0xa4; the view
# draws one at the bottom left only when it is not null).
[[struct]]
name = "cf.menu.struct.VerticalMenuView"
size = 0x1ac
fields = [
  { name = "cursor", off = 0x18, type = "u32" },
  { name = "view", off = 0x38, type = "View" },
  { name = "icon", off = 0xa4, type = "ptr" },
]
mark = "D"
users = ["core/digikit-menu"]
