# menu: Menu, MenuItem, menu views, the SETTINGS menu
# Names follow <cpu>.<subsystem>.<kind>.<name>; was = former names, for reading older docs, never resolved (docs/design/firmware-decls.md).

# `(item, label cstr, &action, icon, &fn4)`: constructs a MenuItem in `item`; copies both functions.
[[fn]]
name = "cf.menu.fn.item_builder"
cpu = "cf"
sig = "void (u8 *item, const char *label, const std_function *action, const u8 *icon, const std_function *fn4)"
rule = { kind = "cf_func", hash = "e115e0c084b379e732551b9618d56beb", offset = 0x0, len = 4 }
mark = "D"
users = ["core/digikit-menu"]

# `VerticalMenuView(this, name cstr, reserve, const std::string *title, icon)`; `title` points at the one-pointer COW string.
[[fn]]
name = "cf.menu.fn.vertical_menu_view_ctor"
was = ["cf.menu.fn.view_ctor"]
cpu = "cf"
sig = "void (u8 *this, const char *name, u32 reserve, const u32 *title, const u8 *icon)"
rule = { kind = "cf_func", hash = "78a29b8d6b996f37e90aa83cbf1eb73d", offset = 0x0, len = 4 }
mark = "D"
users = ["core/digikit-menu"]

