name = "cf.menu.struct.VerticalMenuView"
size = 0x1ac
fields = [
  { name = "cursor", off = 0x18, type = "u32" },
  { name = "view", off = 0x38, type = "View" },
  { name = "icon", off = 0xa4, type = "ptr" },
]
mark = "D"
users = ["core/digikit-menu"]
doc = "VerticalMenuView, 0x1ac bytes (finding 71 section 4, \"VerticalMenuView\"): the Menu base is at +0, the View sub-object at +0x38."

[[hook]]
