# VerticalMenuView, 0x1ac bytes (finding 71 section 4, "VerticalMenuView"): the Menu base is at +0, the View sub-object at +0x38. `cursor` is
# the Menu's cursor row in the window (Menu +0x18, read by core/digikit-menu); `icon` is the icon pointer the ctor stores (+0xa4; the view
# draws one at the bottom left only when it is not null).
