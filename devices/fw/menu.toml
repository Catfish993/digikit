# menu: Menu, MenuItem, menu views, the SETTINGS menu
# Names follow <cpu>.<subsystem>.<kind>.<name>; was = former names, for reading older docs, never resolved (docs/design/firmware-decls.md).

[[fn]]
name = "cf.menu.fn.add_item"
cpu = "cf"
sig = "void (u8 *menu, u8 *item)"
rule = { kind = "cf_func", hash = "2a3c828c0fa23fc30af9aedcb731dee6", offset = 0x0, len = 4 }
mark = "D"
users = ["core/ui"]
doc = "`Menu::addItem(menu, item)` (Menu vtable slot 2, also callable directly): `item` is a raw `MenuItem *` from `operator new(0x54)` that the call wraps in a `shared_ptr<MenuItem>` it keeps; the caller does not free it (read in LedSettingsMenuView 0x400970a8)."

