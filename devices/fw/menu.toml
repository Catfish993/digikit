regs = { in = ["a2"], clobbers = ["d0-d1", "a0-a1", "ccr"] }   # d4 = the saved selection is live
handler = { sig = "void (u8 *menu)", args = ["a2"] }
devices = ["dt2", "dn2"]
mark = "D"
users = ["core/digikit-menu"]
doc = "Last step of the SETTINGS item list rebuild, before the selection is restored (a2 = the settings menu); the hook point for adding an item."

# ---- CompactVerticalMenuView and MenuWithPopoutSideBarsView (PRESET MANAGER, KIT MANAGER, PROJECT MANAGER; finding 71 section 8) ----

[[fn]]
name = "cf.menu.fn.compact_ctor"
cpu = "cf"
sig = "void (u8 *this, const char *name, u32 reserve, i32 x0, i32 y0, i32 x1, i32 y1, i32 pitch, u8 sub_rows)"
rule = { kind = "cf_func", hash = "b08b31e64fd76741695b57ad98eda1c8", offset = 0x0, len = 4 }
mark = "D"
users = ["core/ui"]
doc = "`CompactVerticalMenuView(this, name cstr, reserve, x0, y0, x1, y1, pitch, sub_rows)` (mislabelled `Font::ctor_dtor` in the database): a Menu with `(abs(y1-y0)+1)/pitch - sub_rows` visible rows, the View sub-object at +0x38, the rectangle at +0x198, `pitch` at +0x1a8 and `sub_rows` stored at +0x1b8 (the title-bar flag). Sets the focus bytes +0x1ac and +0x1ad to 1. Object size 0x1c0."

[[fn]]
name = "cf.menu.fn.popout_ctor"
cpu = "cf"
sig = "void (u8 *this, const char *name, u32 reserve, u8 has_left, u8 has_right, u8 sub_rows)"
rule = { kind = "cf_func", hash = "7b05806dd7e5edea90febde36ceab5f5", offset = 0x0, len = 4 }
mark = "D"
users = ["core/ui"]
doc = "`MenuWithPopoutSideBarsView(this, name cstr, reserve, has_left, has_right, sub_rows)`: the main list is a CompactVerticalMenuView at +0 with the rectangle x 0 (2 with a left panel) to 0x7f (0x7d with a right panel), y 0 to 0x3f, pitch 8; it builds the panels `leftPanel` (+0x1c0, x 0 to 0x2b) and `rightPanel` (+0x380, x 0x43 to 0x7f), both 0x28 reserve, pitch 8, no title row; sets the active part (+0x540) to the main list, stores has_left at +0x544 and has_right at +0x545, enables multi-select and calls `popout_set_active(this, this)`. Subclasses (SoundManager, KitManager, ProjectManager) start their own fields at +0x548."

[[fn]]
name = "cf.menu.fn.popout_set_active"
cpu = "cf"
sig = "u32 (u8 *this, u8 *part)"
rule = { kind = "cf_func", hash = "ea44513effadc3e6df9c7d133e1a3ff4", offset = 0x0, len = 4 }
mark = "D"
users = ["core/ui"]
doc = "Clears the focus byte of the left panel, the main list and the right panel (`panel_hide`), sets it on `part` (`panel_show`; one of `this`, `this+0x1c0`, `this+0x380`) and invalidates the view. Returns 1. It does not store +0x540: the key handler (vtable slot 32) stores the active part before it calls this, so a caller that moves focus on its own also writes +0x540. The stock item actions in the subclasses call it as `(this, this)` to return the focus to the main list."

[[fn]]
name = "cf.menu.fn.compact_set_rect"
cpu = "cf"
sig = "void (u8 *view, i32 x0, i32 y0, i32 x1, i32 y1)"
rule.dt2 = { kind = "cf_func", hash = "1397c930deb02823ec21d94b79bd5d36", ordinal = 1, offset = 0x0, len = 4 }
rule.dn2 = { kind = "cf_func", hash = "1397c930deb02823ec21d94b79bd5d36", offset = 0x0, len = 4 }
mark = "D"
users = ["core/ui"]
doc = "Moves a CompactVerticalMenuView to the rectangle x0, y0, x1, y1 (the x and y pairs are ordered by min and max), stores the size (+0x198 to +0x1a4), sets the visible rows to `height / pitch` through Menu vtable slot 17 (it does not subtract the title row, so call it before `set_title_bar`) and invalidates the view. The hash is shared by two functions on the Digitakt II (ordinal 1) and unique on the Digitone II. Stock calls it on the right panel at +0x1c0 with (0, 0, 0x45, 0x3f)."

[[fn]]
name = "cf.menu.fn.set_title"
cpu = "cf"
sig = "void (u8 *view, const u32 *title)"
rule = { kind = "cf_func", hash = "a0e7177be99b6a0b6b00b3ba33aa2874", offset = 0x0, len = 4 }
mark = "D"
users = ["core/ui"]
doc = "Sets the title of a CompactVerticalMenuView (COW string at +0x1bc): `title` points at a COW `std::string`. A title wider than 0x78 pixels in the view font is replaced by \"..\" followed by the tail that fits."

[[fn]]
name = "cf.menu.fn.set_title_bar"
cpu = "cf"
sig = "void (u8 *view, u8 on)"
rule = { kind = "cf_func", hash = "0bf6e1308972da7b29b56fe1f9eaafdd", offset = 0x0, len = 4 }
mark = "D"
users = ["core/ui"]
doc = "Sets the title-bar flag at +0x1b8 of a CompactVerticalMenuView. When the flag changes, the visible rows (Menu vtable slots 16 and 17) change by one: 0 to nonzero takes a row, nonzero to 0 gives it back. The constructor stores its `sub_rows` argument in the same byte after it already subtracted it from the rows. So a view needs a title row either from `sub_rows` 1 in the constructor or from `set_title_bar(view, 1)` after a constructor with `sub_rows` 0; the second call after the first changes nothing. The stock PRESET MANAGER code calls it with 1 after `set_title`."

