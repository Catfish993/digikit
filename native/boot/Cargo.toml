[package]
name = "elektron-native-boot"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Bounded Oracle cold-boot diagnostic runner"

[lib]
name = "elektron_native_boot"
crate-type = ["rlib", "cdylib"]

[features]
default = []
diagnostic-profile = []
diagnostic-events = []
# Host-time and PC profile of the ColdFire execution paths (src/cfprof.rs).
cf-profile = []
# Opt-in live ColdFire<->SHARC+ coupling (SharcPeer). Needs SHARC_GEN_DIR at
# build time for real DSP execution (see native/sharc/build.rs).
sharc = ["dep:sharc-native"]
# The browser core runs the DSP fast tier as wasm kernels the page compiles
# (native/sharc-fast-wasm `host`): digi_sharc_fast.
fast-wasm = ["sharc", "dep:sharc-fast-wasm"]
# Opt-in PCM playback through native/live (cpal output ring).
play = ["dep:live-audio"]

[dependencies]
coldfire = { path = "../coldfire" }
device-profile = { path = "../device-profile" }
dt2-firmware-loader = { path = "../loader" }
emmc-card = { path = "../card" }
machine = { path = "../machine" }
periph = { path = "../periph", default-features = false }
plusdrive-format = { path = "../plusdrive" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sharc-native = { path = "../sharc", optional = true }
sharc-fast-wasm = { path = "../sharc-fast-wasm", optional = true }
live-audio = { path = "../live", optional = true }

[[example]]
name = "sharc_live"
required-features = ["sharc"]

[[example]]
name = "dsp_cold"
required-features = ["sharc"]
