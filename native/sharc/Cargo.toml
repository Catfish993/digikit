[package]
name = "sharc-native"
license.workspace = true
repository.workspace = true
version = "0.0.1"
edition = "2024"
publish = false
description = "Native SHARC+ core generated from tools/sharc_core (tools/sharc_transpile.py, tools/sharc_rsgen.py)"

# std only: no external crate dependencies. The runtime (sharc-rt) and the
# generated core (sharc-gen, ~4 min to build) are separate crates, so editing
# this one leaves the generated core cached. The Cranelift backend of the fast tier
# (native/sharc-fast-cl, which depends on this crate) is a dev-dependency
# for the examples that drive it; nothing links it into the library.
[dependencies]
sharc-rt = { path = "../sharc-rt" }
sharc-gen = { path = "../sharc-gen" }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
sharc-fast-cl = { path = "../sharc-fast-cl" }

[features]
# Per-entry dispatch timing for coupled-run diagnostic builds.
region-profile = []
# SHARC_FAST_DUMP: capture the fast tier's kernels and real calls (the wasm gate).
# Without it the capture hooks compile to nothing.
fast-dump = []

[lib]
name = "sharc_native"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "sharc-check"
path = "src/bin/sharc_check.rs"

[[bin]]
name = "sharc-frames"
path = "src/bin/sharc_frames.rs"
